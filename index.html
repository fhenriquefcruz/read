<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070f" id="themeColor" />
  <title>READ+ · Mind Forge</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ==================== BASE ==================== */
    :root {
      --bg-dark: #05070f;
      --bg-card: rgba(8, 14, 28, 0.85);
      --bg-surface: #0d1424;
      --bg-hover: rgba(255, 255, 255, 0.03);
      --bg-subtle: #0a0f1e;
      --text-primary: #e8edf5;
      --text-secondary: #8a9ab8;
      --text-tertiary: #5a6a88;
      --glow-primary: #00d4ff;
      --glow-purple: #7b2cbf;
      --accent-neon: #00d4ff;
      --border-glow: rgba(0, 212, 255, 0.12);
      --border-default: rgba(255, 255, 255, 0.06);
      --shadow-color: rgba(0, 0, 0, 0.4);
      --card-bg: rgba(8, 14, 28, 0.85);
      --card-border: rgba(0, 212, 255, 0.08);
      --meta-color: #6b7a96;
      --abstract-color: #8a9ab8;
      --transition: all 0.3s ease;
    }

    /* ==================== TEMA CLARO ==================== */
    body.light-theme {
      --bg-dark: #eef1f7;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-surface: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.03);
      --bg-subtle: #f5f7fc;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-tertiary: #6b6b8a;
      --border-glow: rgba(0, 0, 0, 0.06);
      --border-default: rgba(0, 0, 0, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.06);
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --meta-color: #4a4a6a;
      --abstract-color: #3d3d5c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 32px);
      overflow-x: hidden;
      position: relative;
      transition: background var(--transition), color var(--transition);
    }

    /* ==================== BACKGROUND ==================== */
    .neural-network-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 191, 0.08) 0%, transparent 50%);
    }
    .neural-network-bg::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: radial-gradient(rgba(0, 212, 255, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(123, 44, 191, 0.08) 1.5px, transparent 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      animation: neuralProcessing 20s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @keyframes neuralProcessing {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0.4;
      }
      50% {
        transform: translate(10px, -20px) rotate(1deg);
        opacity: 0.8;
      }
      100% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0.4;
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      width: 100%;
    }
    .header {
      text-align: left;
      margin-bottom: 40px;
      max-width: 900px;
    }

    /* ==================== LOGO ==================== */
    .logo-concept {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
      gap: 0;
      margin-bottom: 20px;
      user-select: none;
      padding-bottom: 4px;
    }
    .logo-char {
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      line-height: 1;
      display: inline-block;
      position: relative;
    }
    .logo-char:nth-child(1) {
      font-size: clamp(3.6rem, 8vw, 5.8rem);
      font-weight: 200;
      color: rgba(255, 255, 255, 0.92);
      transform: translateY(8px) skewX(-3deg);
      letter-spacing: -4px;
    }
    .logo-char:nth-child(2) {
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, var(--glow-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transform: translateY(-10px) scaleX(1.08);
      letter-spacing: 2px;
    }
    .logo-char:nth-child(3) {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      transform: translateY(4px) rotate(1.5deg);
      letter-spacing: -6px;
    }
    .logo-char:nth-child(4) {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      color: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      letter-spacing: 0;
      margin-right: 14px;
    }

    /* Tema claro - Logo */
    body.light-theme .logo-char:nth-child(1) {
      color: rgba(0, 0, 0, 0.7);
    }
    body.light-theme .logo-char:nth-child(3) {
      color: rgba(0, 0, 0, 0.5);
    }
    body.light-theme .logo-char:nth-child(4) {
      color: rgba(0, 0, 0, 0.85);
    }
    body.light-theme .logo-char:nth-child(2) {
      background: linear-gradient(135deg, #1a1a2e 0%, #4a4a6a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-node {
      display: inline-block;
      width: clamp(6px, 1vw, 9px);
      height: clamp(6px, 1vw, 9px);
      border-radius: 50%;
      background: var(--glow-primary);
      box-shadow: 0 0 12px var(--glow-primary), 0 0 28px rgba(0, 212, 255, 0.5);
      align-self: center;
      margin-right: 10px;
      animation: nodePulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes nodePulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 12px var(--glow-primary);
      }
      50% {
        transform: scale(1.6);
        box-shadow: 0 0 22px var(--glow-primary), 0 0 44px rgba(0, 212, 255, 0.4);
      }
    }

    .logo-synapse {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      color: var(--glow-primary);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.9), 0 0 50px rgba(123, 44, 191, 0.5);
      transform: translateY(-14px) rotate(6deg);
      display: inline-block;
      animation: synapsePulse 3s infinite ease-in-out;
      align-self: flex-end;
      margin-bottom: 2px;
    }
    @keyframes synapsePulse {
      0%,
      100% {
        opacity: 0.85;
        transform: translateY(-14px) rotate(6deg) scale(1);
      }
      50% {
        opacity: 1;
        transform: translateY(-14px) rotate(6deg) scale(1.12);
        text-shadow: 0 0 30px var(--glow-primary), 0 0 70px rgba(123, 44, 191, 0.6);
      }
    }
    .logo-concept::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, var(--glow-primary), transparent);
      opacity: 0.5;
    }

    .tagline {
      font-size: clamp(0.82rem, 1.8vw, 0.93rem);
      line-height: 1.7;
      color: var(--text-secondary);
      margin-top: 22px;
      max-width: 820px;
      font-weight: 400;
      border-left: 2px solid var(--glow-primary);
      padding-left: 16px;
    }
    .tagline strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ==================== ABAS ==================== */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 28px;
    }
    .main-tab {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 13px 16px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      color: var(--text-secondary);
      transition: all 0.22s ease;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-family: 'Inter', sans-serif;
    }
    .main-tab:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }
    .main-tab.active {
      background: rgba(0, 10, 22, 0.9);
      color: var(--text-primary);
      border-color: var(--glow-primary);
      box-shadow: inset 0 0 18px rgba(0, 212, 255, 0.12), 0 0 10px rgba(0, 212, 255, 0.06);
    }

    /* Tema claro - Abas */
    body.light-theme .main-tab {
      color: #4a4a6a;
      border-color: rgba(0, 0, 0, 0.06);
    }
    body.light-theme .main-tab:hover {
      color: #1a1a2e;
      background: rgba(0, 0, 0, 0.02);
    }
    body.light-theme .main-tab.active {
      background: #ffffff;
      color: #1a1a2e;
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.08);
    }

    /* ==================== GLASS CARD ==================== */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 8px;
      border: 1px solid var(--border-glow);
      padding: clamp(20px, 5vw, 36px);
      box-shadow: 0 40px 80px -20px var(--shadow-color);
      min-height: 300px;
      transition: background var(--transition), border var(--transition), box-shadow var(--transition);
    }

    /* ==================== BUSCADOR ==================== */
    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      width: 100%;
    }
    .search-input {
      flex: 1;
      padding: 15px 22px;
      border-radius: 6px;
      border: 1px solid var(--border-default);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-primary);
      font-size: 0.97rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
      min-width: 0;
    }
    .search-input::placeholder {
      color: var(--text-tertiary);
    }
    .search-input:focus {
      border-color: var(--glow-primary);
      outline: none;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.12);
    }
    .search-btn {
      background: var(--glow-primary);
      border: none;
      padding: 15px 34px;
      border-radius: 6px;
      font-weight: 700;
      color: #03050a;
      cursor: pointer;
      transition: all 0.25s;
      font-size: 0.92rem;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }
    .search-btn:hover {
      background: #00e8ff;
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.3);
    }
    .search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Tema claro - Buscador */
    body.light-theme .search-input {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.08);
      color: #1a1a2e;
    }
    body.light-theme .search-input::placeholder {
      color: #6b6b8a;
    }
    body.light-theme .search-btn {
      background: #1a1a2e;
      color: #ffffff;
    }
    body.light-theme .search-btn:hover {
      background: #2d2d4a;
      box-shadow: 0 0 20px rgba(26, 26, 46, 0.2);
    }

    /* ==================== RESULTADOS ==================== */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 660px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .results-grid::-webkit-scrollbar {
      width: 4px;
    }
    .results-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    .results-grid::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.2);
      border-radius: 2px;
    }

    .virtual-row {
      content-visibility: auto;
      contain-intrinsic-size: 0 140px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 20px 22px;
      border: 1px solid var(--card-border);
      display: flex;
      gap: 18px;
      align-items: flex-start;
      transition: all 0.25s ease;
    }
    .result-card:hover {
      background: var(--bg-hover);
      border-color: var(--glow-primary);
    }

    /* Tema claro - Resultados */
    body.light-theme .result-card {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.06);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    body.light-theme .result-card:hover {
      background: #f8faff;
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .checkbox {
      width: 20px;
      height: 20px;
      min-width: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      color: transparent;
      transition: all 0.18s;
      margin-top: 4px;
    }
    .checkbox.checked {
      background: var(--accent-neon);
      border-color: var(--accent-neon);
      color: #03050a;
      font-weight: 900;
    }

    /* Tema claro - Checkbox */
    body.light-theme .checkbox {
      border-color: rgba(0, 0, 0, 0.15);
      background: #ffffff;
    }
    body.light-theme .checkbox.checked {
      background: #00d4ff;
      border-color: #00d4ff;
      color: #ffffff;
    }

    .card-content {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      display: block;
      margin-bottom: 6px;
      line-height: 1.4;
      transition: color 0.2s;
    }
    .card-title:hover {
      color: var(--glow-primary);
    }

    /* Tema claro - Card Title */
    body.light-theme .card-title {
      color: #1a1a2e;
    }
    body.light-theme .card-title:hover {
      color: #00d4ff;
    }

    .card-meta {
      font-size: 0.72rem;
      color: var(--glow-primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
      opacity: 0.85;
    }

    /* Tema claro - Card Meta */
    body.light-theme .card-meta {
      color: #4a4a6a;
    }

    .card-abstract {
      font-size: 0.89rem;
      color: var(--abstract-color);
      line-height: 1.65;
    }

    /* Tema claro - Card Abstract */
    body.light-theme .card-abstract {
      color: #3d3d5c;
    }

    .favorite-btn {
      color: #ffd700;
    }
    .note-btn {
      color: #7b2cbf;
    }

    .hint-text {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* Tema claro - Hint Text */
    body.light-theme .hint-text {
      color: #6b6b8a;
    }

    /* ==================== FILTROS ==================== */
    .filters-bar select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: inherit;
      transition: border 0.2s;
    }
    .filters-bar select:focus {
      border-color: var(--glow-primary);
      outline: none;
    }

    /* Tema claro - Filtros */
    body.light-theme .filters-bar select {
      background: #ffffff;
      color: #1a1a2e;
      border-color: rgba(0, 0, 0, 0.08);
    }

    /* ==================== RESUMO ==================== */
    .summary-section {
      margin-bottom: 36px;
    }
    .summary-title {
      font-size: 0.9rem;
      color: var(--text-primary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      border-left: 2px solid var(--accent-neon);
      padding-left: 10px;
    }

    /* Tema claro - Summary Title */
    body.light-theme .summary-title {
      color: #1a1a2e;
    }

    /* ==================== FOOTER ==================== */
    .footer {
      text-align: left;
      margin-top: 36px;
      font-size: 0.68rem;
      color: var(--text-secondary);
      opacity: 0.25;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
      .search-area {
        flex-direction: column;
        gap: 10px;
      }
      .search-btn {
        width: 100%;
      }
      .result-card {
        gap: 12px;
        padding: 16px;
      }
      .main-tabs {
        grid-template-columns: repeat(2, 1fr);
      }
      .logo-char:nth-child(1) {
        font-size: clamp(2.8rem, 10vw, 4rem);
      }
      .logo-char:nth-child(2) {
        font-size: clamp(1.8rem, 6vw, 2.8rem);
      }
      .logo-char:nth-child(3) {
        font-size: clamp(2.2rem, 8vw, 3.5rem);
      }
      .logo-char:nth-child(4) {
        font-size: clamp(1.6rem, 5vw, 2.5rem);
      }
      .logo-synapse {
        font-size: clamp(1.6rem, 5vw, 2.4rem);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .glass-card {
        padding: 16px;
      }
      .result-card {
        flex-direction: column;
        gap: 10px;
      }
      .main-tabs {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .main-tab {
        font-size: 0.7rem;
        padding: 10px 8px;
      }
    }

    /* ==================== SCROLLBAR GLOBAL ==================== */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    body.light-theme ::-webkit-scrollbar-thumb {
      background: #c0c8d8;
    }
    body.light-theme ::-webkit-scrollbar-thumb:hover {
      background: #a0a8b8;
    }

    /* ==================== BOTÃO DE TEMA ==================== */
    #themeToggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px var(--shadow-color);
    }
    #themeToggle:hover {
      transform: scale(1.05);
      border-color: var(--glow-primary);
    }

    /* ==================== BOTÃO DE INSTALAÇÃO PWA ==================== */
    #pwa-install-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #00d4ff;
      color: #05070f;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
      display: none;
      transition: all 0.3s;
    }
    #pwa-install-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
    }

    body.light-theme #pwa-install-btn {
      color: #1a1a2e;
    }

    /* ==================== BOTÃO "CARREGAR MAIS" ==================== */
    #loadMoreBtn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: var(--bg-hover);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    #loadMoreBtn:hover {
      background: var(--bg-subtle);
      border-color: var(--glow-primary);
    }

    body.light-theme #loadMoreBtn {
      background: #f0f2f8;
      color: #3d3d5c;
      border-color: rgba(0, 0, 0, 0.06);
    }
    body.light-theme #loadMoreBtn:hover {
      background: #e8ecf4;
      border-color: #00d4ff;
    }

    /* ==================== EXPORT BUTTON ==================== */
    .export-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      padding: 6px 14px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .export-btn:hover {
      background: var(--bg-hover);
