<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#05070f">
  <title>READ +</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========== DESIGN SYSTEM: VIAS NEURAIS & CONCEITUAL ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #03050a;
      --bg-card: rgba(6, 11, 20, 0.75);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent-neon: #00ffcc;
      --text-primary: #f0f3fa;
      --text-secondary: #8a96b5;
      --border-glow: rgba(0, 212, 255, 0.15);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #03050a;
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 32px);
      overflow-x: hidden;
      position: relative;
    }

    /* Background Conceitual: Vias Neurais Pulsantes */
    body::before, body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(123, 44, 191, 0.1) 0%, transparent 50%);
    }
    body::after {
      background-image: 
        linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 44, 191, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black, transparent 70%);
      animation: neuralProcessing 20s linear infinite;
    }

    @keyframes neuralProcessing {
      0% { background-position: 0px 0px; }
      100% { background-position: 60px 120px; }
    }

    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; width: 100%; }
    
    /* HEADER CONCEITUAL */
    .header { text-align: left; margin-bottom: 40px; border-left: 2px solid var(--glow-primary); padding-left: 20px; }
    
    /* LOGO READ + ASSIMÉTRICO */
    .logo {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: baseline;
      line-height: 0.9;
    }
    .logo span {
      font-weight: 300;
      color: var(--glow-primary);
      margin-left: 12px;
      letter-spacing: 2px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
    }
    .tagline { font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; color: var(--accent-neon); margin-top: 12px; opacity: 0.8; }
    
    /* NAVEGAÇÃO PROFISSIONAL */
    .main-tabs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
      margin-bottom: 32px;
    }
    .main-tab {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; font-weight: 500;
      padding: 14px 20px; border-radius: 8px; cursor: pointer; text-align: center;
      color: var(--text-secondary); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .main-tab:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .main-tab.active {
      background: rgba(12, 22, 41, 0.7);
      color: var(--text-primary); border-color: var(--glow-primary);
      box-shadow: inset 0 0 12px rgba(0, 212, 255, 0.15), 0 4px 20px rgba(0,0,0,0.4);
    }
    
    /* DISPOSIÇÃO PROFISSIONAL DO CARD CENTRAL */
    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
      border-radius: 12px; border: 1px solid var(--border-glow); padding: clamp(20px, 5vw, 36px);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7);
    }

    /* BARRA DE BUSCA */
    .search-area { display: flex; gap: 12px; margin-bottom: 32px; width: 100%; }
    .search-input { flex: 1; padding: 16px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.5); color: white; font-size: 1rem; transition: all 0.3s; }
    .search-input:focus { border-color: var(--glow-primary); outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }
    .search-btn { background: #ffffff; border: none; padding: 16px 36px; border-radius: 8px; font-weight: 700; color: #03050a; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
    .search-btn:hover { background: var(--glow-primary); color: #03050a; boxShadow: 0 0 25px rgba(0, 212, 255, 0.4); }

    /* LAYOUT DE ITENS REFINADO */
    .results-grid { display: flex; flex-direction: column; gap: 16px; max-height: 700px; overflow-y: auto; padding-right: 6px; }
    
    .virtual-row { content-visibility: auto; contain-intrinsic-size: 130px; }
    
    .result-card {
      background: rgba(255,255,255,0.01); border-radius: 8px; padding: 20px;
      border: 1px solid rgba(255,255,255,0.04); display: flex; gap: 20px; align-items: flex-start;
      transition: all 0.3s;
    }
    .result-card:hover { background: rgba(255,255,255,0.03); border-color: rgba(0, 212, 255, 0.3); }
    
    .checkbox { width: 20px; height: 20px; min-width: 20px; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: transparent; transition: all 0.2s; margin-top: 2px; }
    .checkbox.checked { background: var(--accent-neon); border-color: var(--accent-neon); color: #03050a; font-weight: 900; }
    
    .card-content { flex: 1; min-width: 0; }
    .card-title { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); text-decoration: none; display: inline-block; margin-bottom: 6px; line-height: 1.4; transition: color 0.2s; }
    .card-title:hover { color: var(--glow-primary); }
    .card-meta { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-abstract { font-size: 0.9rem; color: #a3b0cc; line-height: 1.6; }
    
    .no-results { text-align: center; padding: 60px; color: var(--text-secondary); font-size: 0.95rem; letter-spacing: 0.5px; }
    .footer { text-align: left; margin-top: 32px; font-size: 0.75rem; color: var(--text-secondary); opacity: 0.5; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; }
    
    .summary-section { margin-bottom: 36px; }
    .summary-title { font-size: 1.1rem; color: var(--text-primary); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; opacity: 0.9; }

    /* RESPONSIVIDADE CIRÚRGICA */
    @media (max-width: 768px) {
      .search-area { flex-direction: column; gap: 8px; }
      .search-btn { width: 100%; }
      .result-card { gap: 14px; padding: 16px; }
      .main-tabs { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .header { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header" role="banner">
    <div class="logo">READ<span>+</span></div>
    <div class="tagline">Neural Knowledge Integration</div>
  </header>

  <nav class="main-tabs" role="tablist" aria-label="Abas do Sistema">
    <button class="main-tab active" data-main="articles" role="tab" aria-selected="true" id="tab-articles">📄 Artigos</button>
    <button class="main-tab" data-main="books" role="tab" aria-selected="false" id="tab-books">📚 Livros</button>
    <button class="main-tab" data-main="research" role="tab" aria-selected="false" id="tab-research">🔬 Pesquisas</button>
    <button class="main-tab" data-main="summary" role="tab" aria-selected="false" id="tab-summary">📊 Resumo de Leitura</button>
  </nav>

  <main class="glass-card" id="mainContent" role="main"></main>
  <footer class="footer" role="contentinfo">PROCESSED VIA CORE ENGINE // OPENALEX & GOOGLE BOOKS DIRECT API</footer>
</div>

<script src="js/background.js"></script>
<script src="js/main.js"></script>
</body>
</html>
