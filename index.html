<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070f" />
  <title>READ+ · Mind Forge</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #05070f;
      --bg-card: rgba(8, 14, 28, 0.85);
      --text-primary: #e8edf5;
      --text-secondary: #6b7a96;
      --glow-primary: #00d4ff;
      --glow-purple: #7b2cbf;
      --accent-neon: #00d4ff;
      --border-glow: rgba(0, 212, 255, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 32px);
      overflow-x: hidden;
      position: relative;
    }

    /* ── BACKGROUND NEURAL ── */
    .neural-network-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 191, 0.08) 0%, transparent 50%);
    }
    .neural-network-bg::before {
      content: "";
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background-image:
        radial-gradient(rgba(0, 212, 255, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(123, 44, 191, 0.08) 1.5px, transparent 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      animation: neuralProcessing 20s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @keyframes neuralProcessing {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
      50%  { transform: translate(10px, -20px) rotate(1deg); opacity: 0.8; }
      100% { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
    }

    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; width: 100%; }
    .header { text-align: left; margin-bottom: 40px; max-width: 900px; }

    /* ── LOGO NEURAL DESCONSTRUÍDA ── */
    .logo-concept {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
      gap: 0;
      margin-bottom: 20px;
      user-select: none;
      padding-bottom: 4px;
    }

    .logo-char {
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      line-height: 1;
      display: inline-block;
      position: relative;
    }

    /* R — ultra light, grande, cai levemente */
    .logo-char:nth-child(1) {
      font-size: clamp(3.6rem, 8vw, 5.8rem);
      font-weight: 200;
      color: rgba(255,255,255,0.92);
      transform: translateY(8px) skewX(-3deg);
      letter-spacing: -4px;
    }

    /* E — black weight, menor, sobe */
    .logo-char:nth-child(2) {
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, var(--glow-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transform: translateY(-10px) scaleX(1.08);
      letter-spacing: 2px;
    }

    /* A — médio, alinhado na base */
    .logo-char:nth-child(3) {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      transform: translateY(4px) rotate(1.5deg);
      letter-spacing: -6px;
    }

    /* D — extra bold, menor */
    .logo-char:nth-child(4) {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      color: rgba(255,255,255,0.95);
      transform: translateY(-2px);
      letter-spacing: 0;
      margin-right: 14px;
    }

    /* nó sináptico entre D e + */
    .logo-node {
      display: inline-block;
      width: clamp(6px, 1vw, 9px);
      height: clamp(6px, 1vw, 9px);
      border-radius: 50%;
      background: var(--glow-primary);
      box-shadow: 0 0 12px var(--glow-primary), 0 0 28px rgba(0,212,255,0.5);
      align-self: center;
      margin-right: 10px;
      animation: nodePulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px var(--glow-primary); }
      50%       { transform: scale(1.6); box-shadow: 0 0 22px var(--glow-primary), 0 0 44px rgba(0,212,255,0.4); }
    }

    /* + sinapse */
    .logo-synapse {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      color: var(--glow-primary);
      text-shadow: 0 0 20px rgba(0,212,255,0.9), 0 0 50px rgba(123,44,191,0.5);
      transform: translateY(-14px) rotate(6deg);
      display: inline-block;
      animation: synapsePulse 3s infinite ease-in-out;
      align-self: flex-end;
      margin-bottom: 2px;
    }
    @keyframes synapsePulse {
      0%, 100% { opacity: 0.85; transform: translateY(-14px) rotate(6deg) scale(1); }
      50%       { opacity: 1; transform: translateY(-14px) rotate(6deg) scale(1.12);
                  text-shadow: 0 0 30px var(--glow-primary), 0 0 70px rgba(123,44,191,0.6); }
    }

    /* linha de conexão decorativa sob a logo */
    .logo-concept::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, var(--glow-primary), transparent);
      opacity: 0.5;
    }

    .tagline {
      font-size: clamp(0.82rem, 1.8vw, 0.93rem);
      line-height: 1.7;
      color: var(--text-secondary);
      margin-top: 22px;
      max-width: 820px;
      font-weight: 400;
      border-left: 2px solid var(--glow-primary);
      padding-left: 16px;
    }
    .tagline strong { color: #c8d6ea; font-weight: 600; }

    /* ── ABAS ── */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 28px;
    }
    .main-tab {
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 13px 16px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      color: var(--text-secondary);
      transition: all 0.22s ease;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-family: 'Inter', sans-serif;
    }
    .main-tab:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
    .main-tab.active {
      background: rgba(0,10,22,0.9);
      color: var(--text-primary);
      border-color: var(--glow-primary);
      box-shadow: inset 0 0 18px rgba(0,212,255,0.12), 0 0 10px rgba(0,212,255,0.06);
    }

    /* ── GLASS CARD ── */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 8px;
      border: 1px solid var(--border-glow);
      padding: clamp(20px, 5vw, 36px);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
      min-height: 300px;
    }

    /* ── BUSCADOR ── */
    .search-area { display: flex; gap: 12px; margin-bottom: 28px; width: 100%; }
    .search-input {
      flex: 1;
      padding: 15px 22px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 0.97rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
      min-width: 0;
    }
    .search-input::placeholder { color: var(--text-secondary); }
    .search-input:focus {
      border-color: var(--glow-primary);
      outline: none;
      box-shadow: 0 0 20px rgba(0,212,255,0.12);
    }
    .search-btn {
      background: #ffffff;
      border: none;
      padding: 15px 34px;
      border-radius: 6px;
      font-weight: 700;
      color: #03050a;
      cursor: pointer;
      transition: all 0.25s;
      font-size: 0.92rem;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }
    .search-btn:hover { background: var(--glow-primary); box-shadow: 0 0 24px rgba(0,212,255,0.3); }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── RESULTADOS ── */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 660px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .results-grid::-webkit-scrollbar { width: 4px; }
    .results-grid::-webkit-scrollbar-track { background: transparent; }
    .results-grid::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 2px; }

    .virtual-row { content-visibility: auto; contain-intrinsic-size: 0 140px; }

    .result-card {
      background: rgba(255,255,255,0.012);
      border-radius: 6px;
      padding: 20px 22px;
      border: 1px solid rgba(255,255,255,0.03);
      display: flex;
      gap: 18px;
      align-items: flex-start;
      transition: all 0.25s ease;
    }
    .result-card:hover {
      background: rgba(255,255,255,0.025);
      border-color: rgba(0,212,255,0.18);
    }

    .checkbox {
      width: 20px; height: 20px; min-width: 20px;
      background: rgba(255,255,255,0.02);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 11px;
      color: transparent;
      transition: all 0.18s;
      margin-top: 4px;
    }
    .checkbox.checked {
      background: var(--accent-neon);
      border-color: var(--accent-neon);
      color: #03050a;
      font-weight: 900;
    }

    .card-content { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: #dde8f5;
      text-decoration: none;
      display: block;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .card-title:hover { color: var(--glow-primary); }
    .card-meta {
      font-size: 0.72rem;
      color: var(--glow-primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
      opacity: 0.85;
    }
    .card-abstract {
      font-size: 0.89rem;
      color: #8a9ab8;
      line-height: 1.65;
    }

    .hint-text {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* ── RESUMO ── */
    .summary-section { margin-bottom: 36px; }
    .summary-title {
      font-size: 0.9rem;
      color: #ffffff;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      border-left: 2px solid var(--accent-neon);
      padding-left: 10px;
    }

    /* ── FOOTER ── */
    .footer {
      text-align: left;
      margin-top: 36px;
      font-size: 0.68rem;
      color: var(--text-secondary);
      opacity: 0.25;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .search-area { flex-direction: column; gap: 10px; }
      .search-btn { width: 100%; }
      .result-card { gap: 12px; padding: 16px; }
      .main-tabs { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="neural-network-bg"></div>

  <div class="container">
    <header class="header">
      <div class="logo-concept">
        <span class="logo-char">R</span>
        <span class="logo-char">E</span>
        <span class="logo-char">A</span>
        <span class="logo-char">D</span>
        <span class="logo-node"></span>
        <span class="logo-synapse">+</span>
      </div>
      <p class="tagline">
        O <strong>READ+</strong> integra repositórios globais para localizar <strong>artigos, livros, pesquisas e estudos científicos</strong> com acesso livre e gratuito em formato PDF, otimizando sua jornada de leitura e aprendizado contínuo.
      </p>
    </header>

    <nav class="main-tabs" role="tablist" aria-label="Navegação principal">
      <button class="main-tab" data-main="articles" role="tab" aria-selected="true">Artigos</button>
      <button class="main-tab" data-main="books"    role="tab" aria-selected="false">Livros</button>
      <button class="main-tab" data-main="research" role="tab" aria-selected="false">Pesquisas</button>
      <button class="main-tab" data-main="summary"  role="tab" aria-selected="false">Resumo</button>
    </nav>

    <main class="glass-card">
      <div id="mainContent"></div>
    </main>

    <footer class="footer">READ+ · Mind Forge · Repositórios Globais de Conhecimento Livre</footer>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/background.js"></script>
</body>
</html>
