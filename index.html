<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#03050a">
  <title>READ +</title>
  <link rel="manifest" href="./manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========== DESIGN SYSTEM: COGNITIVE NEURAL INTERFACE ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #03050a;
      --bg-card: rgba(6, 11, 20, 0.85);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent-neon: #00ffcc;
      --text-primary: #f0f3fa;
      --text-secondary: #8a96b5;
      --border-glow: rgba(0, 212, 255, 0.12);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 32px);
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND CONCEITUAL EM CAMADAS: VIAS NEURAIS */
    .neural-network-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: 
        radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 191, 0.07) 0%, transparent 50%);
    }

    .neural-network-bg::before {
      content: "";
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background-image: 
        radial-gradient(rgba(0, 212, 255, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(123, 44, 191, 0.1) 1.5px, transparent 1.5px);
      background-size: 80px 80px;
      background-position: 0 0, 40px 40px;
      animation: neuralPulse 25s linear infinite;
    }

    @keyframes neuralPulse {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(20px, -30px) scale(1.05); opacity: 0.8; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    }

    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; width: 100%; }
    
    /* HEADER REESTRUTURADO */
    .header { text-align: left; margin-bottom: 40px; border-left: 3px solid var(--glow-primary); padding-left: 24px; max-width: 900px; }
    
    .logo {
      font-size: clamp(3rem, 7vw, 4.8rem);
      font-weight: 900;
      letter-spacing: -4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: baseline;
      line-height: 0.9;
    }
    .logo span {
      font-weight: 300;
      color: var(--glow-primary);
      margin-left: 14px;
      letter-spacing: 1px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    
    /* NOVA FRASE APRESENTÁVEL E PROFISSIONAL */
    .tagline { 
      font-size: clamp(0.85rem, 2vw, 0.95rem); 
      line-height: 1.6; 
      color: var(--text-secondary); 
      margin-top: 16px; 
      max-width: 780px;
      font-weight: 400;
    }
    .tagline strong { color: var(--glow-primary); font-weight: 600; }
    
    /* NAVEGAÇÃO EM GRID */
    .main-tabs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
      margin-bottom: 32px;
    }
    .main-tab {
      background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.04); font-size: 0.9rem; font-weight: 500;
      padding: 14px 20px; border-radius: 8px; cursor: pointer; text-align: center;
      color: var(--text-secondary); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .main-tab:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    .main-tab.active {
      background: rgba(10, 20, 38, 0.8);
      color: var(--text-primary); border-color: var(--glow-primary);
      box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.1), 0 4px 25px rgba(0,0,0,0.5);
    }
    
    /* CARD PRINCIPAL GLASSMORPHISM */
    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
      border-radius: 12px; border: 1px solid var(--border-glow); padding: clamp(20px, 5vw, 36px);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
    }

    /* CAMPOS DE INTERAÇÃO */
    .search-area { display: flex; gap: 12px; margin-bottom: 32px; width: 100%; }
    .search-input { flex: 1; padding: 16px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.6); color: white; font-size: 1rem; transition: all 0.3s; }
    .search-input:focus { border-color: var(--glow-primary); outline: none; box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }
    .search-btn { background: #ffffff; border: none; padding: 16px 36px; border-radius: 8px; font-weight: 700; color: #03050a; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; letter-spacing: 0.5px; }
    .search-btn:hover { background: var(--glow-primary); box-shadow: 0 0 25px rgba(0, 212, 255, 0.3); }

    /* LAYOUT PROFISSIONAL DE RESULTADOS */
    .results-grid { display: flex; flex-direction: column; gap: 18px; max-height: 700px; overflow-y: auto; padding-right: 6px; }
    .virtual-row { content-visibility: auto; contain-intrinsic-size: 140px; }
    
    .result-card {
      background: rgba(255,255,255,0.01); border-radius: 8px; padding: 22px;
      border: 1px solid rgba(255,255,255,0.03); display: flex; gap: 20px; align-items: flex-start;
      transition: all 0.3s ease;
    }
    .result-card:hover { background: rgba(255,255,255,0.02); border-color: rgba(0, 212, 255, 0.25); transform: translateY(-1px); }
    
    .checkbox { width: 22px; height: 22px; min-width: 22px; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.15); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: transparent; transition: all 0.2s; margin-top: 3px; }
    .checkbox.checked { background: var(--accent-neon); border-color: var(--accent-neon); color: #03050a; font-weight: 900; }
    
    .card-content { flex: 1; min-width: 0; }
    .card-title { font-size: 1.2rem; font-weight: 600; color: #ffffff; text-decoration: none; display: inline-block; margin-bottom: 6px; line-height: 1.4; transition: color 0.2s; }
    .card-title:hover { color: var(--glow-primary); }
    .card-meta { font-size: 0.75rem; color: var(--glow-primary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
    .card-abstract { font-size: 0.92rem; color: #a5b3cd; line-height: 1.65; text-align: justify; }
    
    .no-results { text-align: center; padding: 60px; color: var(--text-secondary); font-size: 0.95rem; }
    .footer { text-align: left; margin-top: 40px; font-size: 0.75rem; color: var(--text-secondary); opacity: 0.4; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 20px; }
    
    .summary-section { margin-bottom: 40px; }
    .summary-title { font-size: 1.1rem; color: #ffffff; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-left: 2px solid var(--accent-neon); padding-left: 10px; }

    /* RESPONSIVIDADE */
    @media (max-width: 768px) {
      .search-area { flex-direction: column; gap: 10px; }
      .search-btn { width: 100%; }
      .result-card { gap: 14px; padding: 16px; }
      .main-tabs { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .header { border-left-width: 2px; padding-left: 16px; margin-bottom: 28px; }
    }
  </style>
</head>
<body>
<div class="neural-network-bg"></div>

<div class="container">
  <header class="header" role="banner">
    <div class="logo">READ<span>+</span></div>
    <div class="tagline">O <strong>READ+</strong> integra repositórios globais para localizar artigos, livros, pesquisas e estudos científicos com acesso livre e gratuito em formato PDF, otimizando sua jornada de leitura e aprendizado contínuo.</div>
  </header>

  <nav class="main-tabs" role="tablist" aria-label="Navegação Central">
    <button class="main-tab active" data-main="articles" role="tab" aria-selected="true" id="tab-articles">📄 Artigos</button>
    <button class="main-tab" data-main="books" role="tab" aria-selected="false" id="tab-books">📚 Livros</button>
    <button class="main-tab" data-main="research" role="tab" aria-selected="false" id="tab-research">🔬 Pesquisas</button>
    <button class="main-tab" data-main="summary" role="tab" aria-selected="false" id="tab-summary">📊 Resumo de Leitura</button>
  </nav>

  <main class="glass-card" id="mainContent" role="main"></main>
  <footer class="footer" role="contentinfo">NEURAL CORE MATRIX // OPERATIONAL DIRECT INTERFACE</footer>
</div>

<script src="js/main.js"></script>
</body>
</html>
