<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Read+ · Hub do Conhecimento</title>
  <!-- Chart.js para gráficos reais -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Cytoscape.js para knowledge graph dinâmico -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #05070f;
      --bg-card: rgba(12, 18, 28, 0.65);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent: #00d4ff;
      --text-primary: #f0f3fa;
      --text-secondary: #9aa4bf;
      --border-light: rgba(0, 212, 255, 0.2);
      --shadow-neon: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0a0f1c, #02040c);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: linear-gradient(var(--border-light) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: 0.2;
      z-index: 0;
    }
    .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }

    /* cabeçalho */
    .header { text-align: center; margin-bottom: 40px; }
    .logo {
      font-size: 3.8rem; font-weight: 800; letter-spacing: -2px;
      background: linear-gradient(135deg, #fff, var(--glow-primary), var(--glow-secondary));
      background-clip: text; color: transparent;
      text-shadow: 0 0 20px rgba(0,212,255,0.4);
      display: inline-block;
      animation: flicker 3s infinite;
    }
    @keyframes flicker { 0%,100%{opacity:1;text-shadow:0 0 20px rgba(0,212,255,0.4);} 50%{opacity:0.95;text-shadow:0 0 30px rgba(0,212,255,0.8);} }
    .logo span { font-size: 1rem; vertical-align: super; color: var(--glow-primary); }
    .tagline { color: var(--text-secondary); margin-top: 8px; letter-spacing: 1px; }

    /* abas principais */
    .main-tabs {
      display: flex; justify-content: center; gap: 20px; margin-bottom: 28px;
      border-bottom: 1px solid var(--border-light); padding-bottom: 8px; flex-wrap: wrap;
    }
    .main-tab {
      background: none; border: none; font-size: 1.2rem; font-weight: 600;
      padding: 12px 28px; border-radius: 60px; cursor: pointer;
      color: var(--text-secondary); transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .main-tab.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,44,191,0.2));
      color: var(--glow-primary); box-shadow: var(--shadow-neon); border: 1px solid var(--glow-primary);
    }
    .main-tab:hover:not(.active) { color: white; background: rgba(0,212,255,0.1); }

    /* card principal */
    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(16px); border-radius: 2rem;
      border: 1px solid var(--border-light); padding: 28px 32px; transition: all 0.3s;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
    }
    .sub-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; flex-wrap: wrap; }
    .sub-tab {
      background: none; border: none; padding: 6px 18px; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; border-radius: 40px; color: var(--text-secondary); transition: 0.2s;
    }
    .sub-tab.active { background: var(--glow-primary); color: #02040c; box-shadow: 0 0 10px var(--glow-primary); }
    .sub-content { display: none; animation: fadeIn 0.25s ease; }
    .sub-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* formulários e cards */
    .search-area { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .search-input {
      flex: 1; padding: 14px 22px; border-radius: 60px; border: 1px solid var(--border-light);
      background: rgba(0,0,0,0.4); color: white; font-size: 1rem; font-family: 'Inter', sans-serif;
    }
    .search-input:focus { outline: none; border-color: var(--glow-primary); box-shadow: 0 0 0 3px rgba(0,212,255,0.3); }
    .search-btn {
      background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary));
      border: none; padding: 12px 32px; border-radius: 60px; font-weight: 700; color: white; cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }
    .search-btn:hover { transform: scale(1.02); filter: brightness(1.05); }
    .results-grid { display: flex; flex-direction: column; gap: 16px; max-height: 550px; overflow-y: auto; padding-right: 6px; }
    .result-card {
      background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); border-radius: 24px; padding: 18px;
      transition: all 0.2s; border: 1px solid rgba(0,212,255,0.2); display: flex; gap: 16px; align-items: flex-start;
      margin-bottom: 12px;
    }
    .result-card:hover { transform: translateX(6px); border-color: var(--glow-primary); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
    .checkbox {
      width: 24px; height: 24px; background: rgba(255,255,255,0.1); border: 2px solid var(--glow-primary);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
    }
    .checkbox.checked { background: var(--glow-primary); color: black; }
    .card-content { flex: 1; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--glow-primary); text-decoration: none; display: inline-block; margin-bottom: 6px; }
    .card-meta { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; }
    .card-abstract { font-size: 0.85rem; margin: 8px 0; opacity: 0.9; line-height: 1.4; }
    .btn-link, .action-btn {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(0,212,255,0.2);
      padding: 5px 12px; border-radius: 40px; text-decoration: none; font-size: 0.7rem; font-weight: 500;
      color: white; transition: 0.2s; border: none; cursor: pointer;
    }
    .btn-link:hover, .action-btn:hover { background: var(--glow-primary); color: #02040c; }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; background: rgba(0,0,0,0.3); border-radius: 60px; padding: 8px 20px; }
    .progress-ring { width: 44px; height: 44px; }
    .progress-ring-circle { transition: stroke-dashoffset 0.35s; transform: rotate(-90deg); transform-origin: 50% 50%; stroke: var(--glow-primary); fill: none; stroke-width: 3; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .dashboard-card { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border-radius: 28px; padding: 20px; border: 1px solid var(--border-light); }
    .graph-container { height: 300px; position: relative; }
    .cy-container { height: 500px; width: 100%; background: rgba(0,0,0,0.3); border-radius: 24px; margin-top: 20px; }
    .badge { background: linear-gradient(135deg, #00d4ff, #7b2cbf); border-radius: 40px; padding: 4px 12px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
    .inline-edit { background: rgba(0,0,0,0.5); border: 1px solid var(--glow-primary); border-radius: 12px; padding: 12px; width: 100%; color: white; margin-top: 8px; }
    .filter-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-group select, .filter-group input { background: rgba(0,0,0,0.6); border: 1px solid var(--glow-primary); padding: 8px 16px; border-radius: 40px; color: white; }
    .comparison-table { width: 100%; border-collapse: collapse; }
    .comparison-table th, .comparison-table td { border: 1px solid var(--border-light); padding: 12px; text-align: left; vertical-align: top; }
    @media (max-width: 700px) { .glass-card { padding: 18px; } .main-tab { padding: 8px 16px; font-size: 1rem; } .result-card { flex-direction: column; } .search-area { flex-direction: column; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Read <span>+</span></div>
    <div class="tagline">hub do conhecimento | segundo cérebro | evolução acadêmica</div>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" data-main="articles">📄 Artigos</button>
    <button class="main-tab" data-main="books">📚 Livros</button>
    <button class="main-tab" data-main="research">🔬 Pesquisas</button>
    <button class="main-tab" data-main="studio">📊 Estúdio</button>
  </div>

  <div class="glass-card" id="mainContent"></div>
  <div class="footer">🔎 Fontes: OpenAlex (artigos/pesquisas) · Google Books · dados abertos | Tudo gratuito e local</div>
</div>

<script>
  // ======================== ESTADO GLOBAL ========================
  let currentMainTab = 'articles';
  let articlesData = [];
  let booksData = [];
  let researchData = [];
  let readArticles = new Set();      // ids lidos (apenas artigos)
  let readBooks = new Set();         // ids lidos (livros)
  let readResearch = new Set();      // ids lidos (pesquisas)
  
  let favorites = { articles: [], books: [], research: [] };
  let notes = {};
  let collections = [];              // cada coleção: { id, name, items: [{ id, type, title, ... }] }
  let tags = {};                    // tag -> array de ids
  let userProfile = { name: "Pesquisador", avatar: "👨‍🎓", level: 0, xp: 0, badges: [] };
  let goals = [];                   // { id, type, target, current, title }
  let studyLog = [];                // { date, id, type }
  let lastDataUpdate = Date.now();

  // Carregar dados do localStorage
  function loadAllData() {
    try {
      const storedReadArticles = localStorage.getItem('readplus_read_articles');
      if (storedReadArticles) readArticles = new Set(JSON.parse(storedReadArticles));
      const storedReadBooks = localStorage.getItem('readplus_read_books');
      if (storedReadBooks) readBooks = new Set(JSON.parse(storedReadBooks));
      const storedReadResearch = localStorage.getItem('readplus_read_research');
      if (storedReadResearch) readResearch = new Set(JSON.parse(storedReadResearch));
      const storedFav = localStorage.getItem('readplus_favorites');
      if (storedFav) favorites = JSON.parse(storedFav);
      const storedNotes = localStorage.getItem('readplus_notes');
      if (storedNotes) notes = JSON.parse(storedNotes);
      const storedCollections = localStorage.getItem('readplus_collections');
      if (storedCollections) collections = JSON.parse(storedCollections);
      const storedTags = localStorage.getItem('readplus_tags');
      if (storedTags) tags = JSON.parse(storedTags);
      const storedProfile = localStorage.getItem('readplus_profile');
      if (storedProfile) userProfile = JSON.parse(storedProfile);
      const storedGoals = localStorage.getItem('readplus_goals');
      if (storedGoals) goals = JSON.parse(storedGoals);
      const storedStudyLog = localStorage.getItem('readplus_study_log');
      if (storedStudyLog) studyLog = JSON.parse(storedStudyLog);
    } catch(e) { console.warn(e); }
  }
  function saveAllData() {
    localStorage.setItem('readplus_read_articles', JSON.stringify([...readArticles]));
    localStorage.setItem('readplus_read_books', JSON.stringify([...readBooks]));
    localStorage.setItem('readplus_read_research', JSON.stringify([...readResearch]));
    localStorage.setItem('readplus_favorites', JSON.stringify(favorites));
    localStorage.setItem('readplus_notes', JSON.stringify(notes));
    localStorage.setItem('readplus_collections', JSON.stringify(collections));
    localStorage.setItem('readplus_tags', JSON.stringify(tags));
    localStorage.setItem('readplus_profile', JSON.stringify(userProfile));
    localStorage.setItem('readplus_goals', JSON.stringify(goals));
    localStorage.setItem('readplus_study_log', JSON.stringify(studyLog));
  }
  loadAllData();

  // Helper: adicionar XP e verificar nível
  function addXP(amount, action = '') {
    userProfile.xp += amount;
    let newLevel = Math.floor(userProfile.xp / 100);
    if (newLevel > 4) newLevel = 4;
    if (newLevel > userProfile.level) {
      userProfile.level = newLevel;
      const levelNames = ['Explorador','Pesquisador','Analista','Especialista','Mestre do Conhecimento'];
      if (!userProfile.badges.includes(levelNames[newLevel])) userProfile.badges.push(levelNames[newLevel]);
      showToast(`🎉 Parabéns! Você alcançou o nível ${levelNames[newLevel]}!`);
    }
    saveAllData();
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.innerText = msg;
    toast.style.position = 'fixed'; toast.style.bottom = '20px'; toast.style.right = '20px';
    toast.style.background = 'var(--glow-primary)'; toast.style.color = '#02040c'; toast.style.padding = '12px 24px';
    toast.style.borderRadius = '40px'; toast.style.zIndex = '9999'; toast.style.fontWeight = 'bold';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function registerRead(id, type, title = '') {
    const today = new Date().toISOString().slice(0,10);
    if (!studyLog.find(l => l.date === today && l.id === id)) {
      studyLog.push({ date: today, id, type });
      saveAllData();
      addXP(10, 'read');
      // atualizar metas
      goals.forEach(goal => {
        if (goal.type === type && goal.current < goal.target) {
          goal.current++;
          if (goal.current >= goal.target) showToast(`🎯 Meta "${goal.title}" concluída! +20 XP`);
          saveAllData();
        }
      });
      addXP(5, 'goal_progress');
    }
  }

  // APIs
  async function searchArticles(query, filters = {}) {
    let url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=open_access.is_oa:true&sort=relevance_score:desc&per-page=20`;
    if (filters.year) url += `&filter=publication_year:${filters.year}`;
    if (filters.minCited) url += `&filter=cited_by_count:>${filters.minCited}`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results.map(work => ({
      id: btoa(work.id).replace(/[^a-zA-Z0-9]/g, ''),
      title: work.title || 'Sem título',
      authors: work.authorships?.map(a => a.author.display_name) || [],
      abstract: work.abstract || 'Resumo não disponível.',
      url: work.open_access?.oa_url || work.best_oa_location?.pdf_url || work.id,
      source: 'OpenAlex',
      doi: work.doi,
      citations: work.cited_by_count,
      publication_date: work.publication_date,
      institutions: work.authorships?.[0]?.institutions?.map(i => i.display_name) || [],
      type: 'article'
    }));
  }
  async function searchBooks(query) {
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=20`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.items) return [];
    return data.items.map(item => ({
      id: item.id,
      title: item.volumeInfo.title,
      authors: item.volumeInfo.authors || ['Autor não informado'],
      abstract: item.volumeInfo.description || 'Sinopse não disponível.',
      url: item.volumeInfo.previewLink || item.volumeInfo.infoLink,
      source: 'Google Books',
      publishedDate: item.volumeInfo.publishedDate,
      type: 'book'
    }));
  }
  async function searchResearch(query) {
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=type:article,type:report&sort=relevance_score:desc&per-page=15`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results.map(work => ({
      id: btoa(work.id).replace(/[^a-zA-Z0-9]/g, ''),
      title: work.title || 'Sem título',
      authors: work.authorships?.map(a => a.author.display_name) || [],
      abstract: work.abstract || 'Resumo não disponível.',
      url: work.open_access?.oa_url || work.best_oa_location?.pdf_url || work.id,
      source: 'OpenAlex',
      citations: work.cited_by_count,
      type: 'research'
    }));
  }

  // Funções de gerenciamento de favoritos
  function toggleFavorite(item, type) {
    const list = favorites[type];
    const index = list.findIndex(i => i.id === item.id);
    if (index === -1) {
      list.push({ id: item.id, title: item.title, type, url: item.url, date: new Date().toISOString() });
      addXP(5, 'favorite');
      showToast(`⭐ ${item.title.substring(0,50)} adicionado aos favoritos`);
    } else {
      list.splice(index,1);
      showToast(`🗑️ Removido dos favoritos`);
    }
    saveAllData();
  }

  function isFavorite(id, type) {
    return favorites[type].some(i => i.id === id);
  }

  // Coleções
  function createCollection(name) {
    const newCol = { id: Date.now(), name, items: [] };
    collections.push(newCol);
    saveAllData();
    addXP(10, 'collection');
    showToast(`📂 Coleção "${name}" criada`);
  }
  function addToCollection(collectionId, item) {
    const col = collections.find(c => c.id == collectionId);
    if (col && !col.items.some(i => i.id === item.id)) {
      col.items.push({ id: item.id, title: item.title, type: item.type, url: item.url });
      saveAllData();
      addXP(3, 'add_to_collection');
    }
  }

  // Tags
  function addTag(id, tag, type) {
    if (!tags[tag]) tags[tag] = [];
    if (!tags[tag].includes(id)) tags[tag].push(id);
    saveAllData();
    addXP(2, 'tag');
  }

  // ======================== RENDERIZAÇÃO DAS ABAS ========================
  function renderSearchResults(containerId, items, type, readSet, onCheck) {
    const container = document.getElementById(containerId);
    if (!items.length) { container.innerHTML = '<div class="no-results">Nenhum resultado encontrado</div>'; return; }
    container.innerHTML = items.map(item => `
      <div class="result-card" data-id="${item.id}">
        <div class="checkbox ${readSet.has(item.id) ? 'checked' : ''}" data-id="${item.id}" data-type="${type}">${readSet.has(item.id) ? '✓' : ''}</div>
        <div class="card-content">
          <a href="${item.url}" target="_blank" class="card-title">${escapeHtml(item.title)}</a>
          <div class="card-meta">${item.authors.slice(0,3).join(', ')} · ${item.source} ${item.publication_date ? '· '+item.publication_date.slice(0,4) : ''}</div>
          <div class="card-abstract">${escapeHtml(item.abstract.substring(0,280))}…</div>
          <div>
            <button class="action-btn fav-btn" data-id="${item.id}" data-type="${type}" data-title="${escapeHtml(item.title)}" data-url="${item.url}">${isFavorite(item.id, type) ? '❤️ Favoritado' : '🤍 Favoritar'}</button>
            <button class="action-btn note-btn" data-id="${item.id}" data-type="${type}">📝 Nota</button>
            <button class="action-btn tag-btn" data-id="${item.id}" data-type="${type}">🏷️ Tag</button>
            <button class="action-btn collection-btn" data-id="${item.id}" data-type="${type}" data-title="${escapeHtml(item.title)}" data-url="${item.url}">📂 Coleção</button>
          </div>
        </div>
      </div>
    `).join('');
    // checkboxes
    document.querySelectorAll(`#${containerId} .checkbox`).forEach(cb => {
      cb.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = cb.dataset.id;
        const t = cb.dataset.type;
        if (t === 'article') { if (readArticles.has(id)) readArticles.delete(id); else { readArticles.add(id); registerRead(id, 'article', items.find(i=>i.id===id)?.title); } saveAllData(); }
        else if (t === 'book') { if (readBooks.has(id)) readBooks.delete(id); else { readBooks.add(id); registerRead(id, 'book'); } saveAllData(); }
        else if (t === 'research') { if (readResearch.has(id)) readResearch.delete(id); else { readResearch.add(id); registerRead(id, 'research'); } saveAllData(); }
        renderSearchResults(containerId, items, type, readSet, onCheck);
      });
    });
    // favoritar
    document.querySelectorAll(`#${containerId} .fav-btn`).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const t = btn.dataset.type;
        const item = items.find(i => i.id === id);
        toggleFavorite(item, t);
        renderSearchResults(containerId, items, type, readSet, onCheck);
      });
    });
    // notas, tags, coleções (simplificado mas funcional)
    document.querySelectorAll(`#${containerId} .note-btn`).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const txt = prompt('Adicione uma nota pessoal:');
        if (txt) { notes[id] = { ...notes[id], comment: txt }; saveAllData(); addXP(5); showToast('Nota salva!'); }
      });
    });
    document.querySelectorAll(`#${containerId} .tag-btn`).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const tag = prompt('Tag (ex: IA, Filosofia):');
        if (tag) addTag(id, tag, btn.dataset.type);
      });
    });
    document.querySelectorAll(`#${containerId} .collection-btn`).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const title = btn.dataset.title;
        const url = btn.dataset.url;
        const type = btn.dataset.type;
        const colName = prompt('Nome da coleção existente ou nova:');
        if (colName) {
          let col = collections.find(c => c.name === colName);
          if (!col) { col = { id: Date.now(), name: colName, items: [] }; collections.push(col); saveAllData(); }
          if (!col.items.some(i => i.id === id)) {
            col.items.push({ id, title, type, url });
            saveAllData();
            showToast(`Adicionado à coleção "${colName}"`);
          }
        }
      });
    });
  }

  // Aba Artigos
  async function renderArticlesTab() {
    const html = `
      <div class="sub-tabs"><button class="sub-tab active" data-sub="search">🔍 Buscar artigos</button><button class="sub-tab" data-sub="read">✅ Meus lidos</button></div>
      <div id="articlesSearchSub" class="sub-content active">
        <div class="filter-group"><input id="articlesQuery" class="search-input" placeholder="Ex: machine learning"><input id="yearFilter" placeholder="Ano (ex: 2023)"><input id="minCited" placeholder="Mínimo de citações"><button id="articlesSearchBtn" class="search-btn">Pesquisar</button></div>
        <div id="articlesResults"></div>
      </div>
      <div id="articlesReadSub" class="sub-content"><div id="readArticlesList"></div></div>
    `;
    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('articlesSearchBtn').addEventListener('click', async () => {
      const q = document.getElementById('articlesQuery').value;
      const year = document.getElementById('yearFilter').value;
      const minCited = document.getElementById('minCited').value;
      if (!q) return;
      const resDiv = document.getElementById('articlesResults');
      resDiv.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      const arts = await searchArticles(q, { year, minCited });
      articlesData = arts;
      renderSearchResults('articlesResults', arts, 'article', readArticles);
    });
    // Meus lidos
    const lidos = articlesData.filter(a => readArticles.has(a.id));
    const readDiv = document.getElementById('readArticlesList');
    if (lidos.length) readDiv.innerHTML = lidos.map(a => `<div class="result-card"><div class="card-content"><a href="${a.url}" class="card-title">${a.title}</a><div class="card-meta">${a.authors.join(', ')}</div></div></div>`).join('');
    else readDiv.innerHTML = '<div class="no-results">Nenhum artigo lido ainda</div>';
  }

  // ======================== ESTÚDIO (todas as funcionalidades completas) ========================
  function renderStudioTab() {
    const html = `
      <div class="sub-tabs">
        <button class="sub-tab active" data-sub="dashboard">📈 Dashboard</button>
        <button class="sub-tab" data-sub="knowledge">🧠 Knowledge Base</button>
        <button class="sub-tab" data-sub="goals">🎯 Metas</button>
        <button class="sub-tab" data-sub="gamification">🏆 Gamificação</button>
        <button class="sub-tab" data-sub="graph">🗺️ Knowledge Graph</button>
        <button class="sub-tab" data-sub="radar">📡 Radar Científico</button>
        <button class="sub-tab" data-sub="compare">⚖️ Comparador</button>
        <button class="sub-tab" data-sub="favorites">❤️ Favoritos</button>
        <button class="sub-tab" data-sub="collections">📂 Coleções</button>
        <button class="sub-tab" data-sub="tags">🏷️ Tags</button>
        <button class="sub-tab" data-sub="calendar">📅 Calendário</button>
        <button class="sub-tab" data-sub="profile">👤 Perfil</button>
        <button class="sub-tab" data-sub="export">💾 Exportar</button>
      </div>
      <div id="studioDashboard" class="sub-content active"></div>
      <div id="studioKnowledge" class="sub-content"></div>
      <div id="studioGoals" class="sub-content"></div>
      <div id="studioGamification" class="sub-content"></div>
      <div id="studioGraph" class="sub-content"></div>
      <div id="studioRadar" class="sub-content"></div>
      <div id="studioCompare" class="sub-content"></div>
      <div id="studioFavorites" class="sub-content"></div>
      <div id="studioCollections" class="sub-content"></div>
      <div id="studioTags" class="sub-content"></div>
      <div id="studioCalendar" class="sub-content"></div>
      <div id="studioProfile" class="sub-content"></div>
      <div id="studioExport" class="sub-content"></div>
    `;
    document.getElementById('mainContent').innerHTML = html;
    // eventos sub-abas
    document.querySelectorAll('.sub-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.sub;
        document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.sub-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`studio${target.charAt(0).toUpperCase() + target.slice(1)}`).classList.add('active');
        if (target === 'dashboard') renderDashboard();
        if (target === 'knowledge') renderKnowledgeBase();
        if (target === 'goals') renderGoals();
        if (target === 'gamification') renderGamification();
        if (target === 'graph') renderKnowledgeGraph();
        if (target === 'radar') renderRadar();
        if (target === 'compare') renderCompare();
        if (target === 'favorites') renderFavorites();
        if (target === 'collections') renderCollections();
        if (target === 'tags') renderTags();
        if (target === 'calendar') renderCalendar();
        if (target === 'profile') renderProfile();
        if (target === 'export') renderExport();
      });
    });
    renderDashboard();
  }

  function renderDashboard() {
    const totalRead = readArticles.size + readBooks.size + readResearch.size;
    const last30 = Array(30).fill().map((_,i) => new Date(Date.now()-i*86400000).toISOString().slice(0,10)).reverse();
    const weeklyReads = studyLog.filter(l => new Date(l.date) > new Date(Date.now()-7*86400000)).length;
    const monthlyReads = studyLog.filter(l => new Date(l.date) > new Date(Date.now()-30*86400000)).length;
    const streak = calculateStreak();
    const maxStreak = calculateMaxStreak();
    document.getElementById('studioDashboard').innerHTML = `
      <div class="dashboard-grid">
        <div class="dashboard-card"><h3>📊 Resumo</h3><p>Total lidos: ${totalRead}</p><p>Leituras esta semana: ${weeklyReads}</p><p>Leituras este mês: ${monthlyReads}</p><p>Sequência atual: ${streak} dias</p><p>Maior sequência: ${maxStreak} dias</p></div>
        <div class="dashboard-card"><h3>📈 Evolução mensal</h3><canvas id="monthlyChart" height="200"></canvas></div>
        <div class="dashboard-card"><h3>🏷️ Tags mais usadas</h3><div id="topTags"></div></div>
      </div>
    `;
    const monthly = {};
    studyLog.forEach(l => { const m = l.date.slice(0,7); monthly[m] = (monthly[m]||0)+1; });
    const months = Object.keys(monthly).sort();
    const counts = months.map(m => monthly[m]);
    setTimeout(() => {
      const ctx = document.getElementById('monthlyChart')?.getContext('2d');
      if (ctx) new Chart(ctx, { type: 'line', data: { labels: months, datasets: [{ label: 'Leituras', data: counts, borderColor: '#00d4ff' }] } });
    }, 100);
    const tagCounts = Object.entries(tags).map(([t,ids]) => [t, ids.length]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    document.getElementById('topTags').innerHTML = tagCounts.map(([t,c]) => `<span class="badge">${t} (${c})</span>`).join('');
  }

  function calculateStreak() {
    let streak = 0;
    let dates = [...new Set(studyLog.map(l => l.date))].sort().reverse();
    let lastDate = new Date().toISOString().slice(0,10);
    for (let d of dates) {
      if (d === lastDate) { streak++; lastDate = new Date(Date.parse(lastDate)-86400000).toISOString().slice(0,10); }
      else break;
    }
    return streak;
  }
  function calculateMaxStreak() {
    let dates = [...new Set(studyLog.map(l => l.date))].sort();
    let maxStreak = 0, current = 0, prev = null;
    for (let d of dates) {
      if (prev && new Date(d)-new Date(prev) === 86400000) current++;
      else current = 1;
      maxStreak = Math.max(maxStreak, current);
      prev = d;
    }
    return maxStreak;
  }

  function renderKnowledgeBase() {
    let items = [];
    [...readArticles].forEach(id => { const art = articlesData.find(a=>a.id===id) || { title: 'Artigo', id }; items.push({ id, title: art.title, type: 'article', data: art }); });
    [...readBooks].forEach(id => { const b = booksData.find(b=>b.id===id) || { title: 'Livro', id }; items.push({ id, title: b.title, type: 'book', data: b }); });
    [...readResearch].forEach(id => { const r = researchData.find(r=>r.id===id) || { title: 'Pesquisa', id }; items.push({ id, title: r.title, type: 'research', data: r }); });
    document.getElementById('studioKnowledge').innerHTML = items.map(item => `
      <div class="result-card"><div class="card-content"><div class="card-title">${escapeHtml(item.title)}</div><textarea id="note-${item.id}" class="inline-edit" placeholder="Notas...">${notes[item.id]?.comment || ''}</textarea><button class="action-btn save-note" data-id="${item.id}">Salvar nota</button></div></div>
    `).join('');
    document.querySelectorAll('.save-note').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const comment = document.getElementById(`note-${id}`).value;
        if (!notes[id]) notes[id] = {};
        notes[id].comment = comment;
        saveAllData();
        showToast('Nota salva! +5 XP');
        addXP(5);
      });
    });
  }

  function renderGoals() {
    let goalsHtml = goals.map((g,idx) => `<div class="result-card"><div>🎯 ${g.title} (${g.type}): ${g.current}/${g.target}</div><progress value="${g.current}" max="${g.target}"></progress><button class="action-btn remove-goal" data-idx="${idx}">🗑️</button></div>`).join('');
    document.getElementById('studioGoals').innerHTML = `
      <div class="search-area"><input id="goalTitle" placeholder="Título da meta" class="search-input"><input id="goalType" placeholder="article/book/research" class="search-input"><input id="goalTarget" placeholder="Quantidade" type="number" class="search-input"><button id="addGoalBtn" class="search-btn">Adicionar Meta</button></div>
      <div id="goalsList">${goalsHtml || '<div>Nenhuma meta definida</div>'}</div>
    `;
    document.getElementById('addGoalBtn')?.addEventListener('click', () => {
      const title = document.getElementById('goalTitle').value;
      const type = document.getElementById('goalType').value;
      const target = parseInt(document.getElementById('goalTarget').value);
      if (title && type && target) {
        goals.push({ id: Date.now(), title, type, target, current: 0 });
        saveAllData();
        renderGoals();
      }
    });
    document.querySelectorAll('.remove-goal').forEach(btn => {
      btn.addEventListener('click', () => { goals.splice(btn.dataset.idx,1); saveAllData(); renderGoals(); });
    });
  }

  function renderGamification() {
    const levelNames = ['Explorador','Pesquisador','Analista','Especialista','Mestre do Conhecimento'];
    const nextXP = (userProfile.level+1)*100 - userProfile.xp;
    document.getElementById('studioGamification').innerHTML = `
      <div class="dashboard-card"><h3>🏅 ${levelNames[userProfile.level]}</h3><p>XP: ${userProfile.xp} / ${(userProfile.level+1)*100}</p><progress value="${userProfile.xp}" max="${(userProfile.level+1)*100}"></progress><p>Próximo nível em ${nextXP} XP</p></div>
      <div class="dashboard-card"><h3>🎖️ Badges</h3><div>${userProfile.badges.map(b => `<span class="badge">${b}</span>`).join('') || 'Nenhum ainda'}</div></div>
    `;
  }

  function renderKnowledgeGraph() {
    document.getElementById('studioGraph').innerHTML = '<div id="cy" class="cy-container"></div>';
    const nodes = [{ data: { id: 'Read+' } }];
    const edges = [];
    const tagNodes = Object.keys(tags).slice(0,10);
    tagNodes.forEach(tag => { nodes.push({ data: { id: tag } }); edges.push({ data: { source: 'Read+', target: tag } }); });
    setTimeout(() => {
      const cy = cytoscape({ container: document.getElementById('cy'), elements: [...nodes, ...edges], style: [{ selector: 'node', style: { 'background-color': '#00d4ff', label: 'data(id)', color: 'white' } }], layout: { name: 'circle' } });
    }, 50);
  }

  async function renderRadar() {
    document.getElementById('studioRadar').innerHTML = `<div class="search-area"><input id="radarTopic" class="search-input"><button id="radarSearch" class="search-btn">Buscar Novidades</button></div><div id="radarResults"></div>`;
    document.getElementById('radarSearch').addEventListener('click', async () => {
      const topic = document.getElementById('radarTopic').value;
      if (!topic) return;
      const resDiv = document.getElementById('radarResults');
      resDiv.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      const arts = await searchArticles(topic);
      resDiv.innerHTML = arts.map(a => `<div class="result-card"><div class="card-content"><a href="${a.url}" target="_blank" class="card-title">${a.title}</a><div class="card-meta">${a.authors.join(', ')}</div><div class="card-abstract">${a.abstract.substring(0,200)}</div></div></div>`).join('');
    });
  }

  function renderCompare() {
    document.getElementById('studioCompare').innerHTML = `<div id="compareSelect" class="results-grid"></div><button id="doCompare" class="search-btn">Comparar Selecionados</button><div id="compareResult"></div>`;
    const recent = articlesData.slice(0,10);
    document.getElementById('compareSelect').innerHTML = recent.map(a => `<div class="result-card"><label><input type="checkbox" class="compare-chk" data-id="${a.id}" data-title="${a.title}" data-authors="${a.authors.join(', ')}" data-citations="${a.citations}" data-year="${a.publication_date?.slice(0,4)}"> ${a.title}</label></div>`).join('');
    document.getElementById('doCompare').addEventListener('click', () => {
      const selected = Array.from(document.querySelectorAll('.compare-chk:checked')).map(cb => ({
        title: cb.dataset.title, authors: cb.dataset.authors, citations: cb.dataset.citations, year: cb.dataset.year
      }));
      if (selected.length < 2) { alert('Selecione pelo menos 2 artigos'); return; }
      let html = '<table class="comparison-table"><tr><th>Atributo</th>' + selected.map(s => `<th>${s.title.substring(0,30)}</th>`).join('') + '</tr>';
      html += '<tr><td>Autores</td>' + selected.map(s => `<td>${s.authors}</td>`).join('') + '</tr>';
      html += '<tr><td>Ano</td>' + selected.map(s => `<td>${s.year}</td>`).join('') + '</tr>';
      html += '<tr><td>Citações</td>' + selected.map(s => `<td>${s.citations}</td>`).join('') + '</tr>';
      html += '</table>';
      document.getElementById('compareResult').innerHTML = html;
    });
  }

  function renderFavorites() {
    const allFavs = [...favorites.articles, ...favorites.books, ...favorites.research];
    document.getElementById('studioFavorites').innerHTML = allFavs.map(f => `<div class="result-card"><div class="card-content"><a href="${f.url}" target="_blank" class="card-title">${f.title}</a><div class="card-meta">${f.type} · ${new Date(f.date).toLocaleDateString()}</div><button class="action-btn unfav" data-id="${f.id}" data-type="${f.type}">Remover</button></div></div>`).join('');
    document.querySelectorAll('.unfav').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        favorites[type] = favorites[type].filter(i => i.id !== id);
        saveAllData();
        renderFavorites();
      });
    });
  }

  function renderCollections() {
    document.getElementById('studioCollections').innerHTML = `<div><input id="newColName" class="search-input"><button id="createCol" class="search-btn">Criar Coleção</button></div>${collections.map(col => `<div class="result-card"><strong>${col.name}</strong><ul>${col.items.map(i => `<li>${i.title} <button class="action-btn remove-col-item" data-col="${col.id}" data-id="${i.id}">🗑️</button></li>`).join('')}</ul><button class="action-btn delete-col" data-id="${col.id}">Excluir Coleção</button></div>`).join('')}`;
    document.getElementById('createCol')?.addEventListener('click', () => {
      const name = document.getElementById('newColName').value;
      if (name) createCollection(name);
    });
  }

  function renderTags() {
    const tagList = Object.entries(tags).map(([t,ids]) => `<div class="result-card"><span class="badge" data-tag="${t}">${t} (${ids.length})</span><button class="action-btn filter-tag" data-tag="${t}">Filtrar</button></div>`).join('');
    document.getElementById('studioTags').innerHTML = tagList;
    document.querySelectorAll('.filter-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        const ids = tags[tag];
        const related = articlesData.filter(a => ids.includes(a.id)).concat(booksData.filter(b=>ids.includes(b.id)), researchData.filter(r=>ids.includes(r.id)));
        alert(`Conteúdos com a tag "${tag}": ${related.length} itens`);
      });
    });
  }

  function renderCalendar() {
    const last30 = Array(30).fill().map((_,i) => new Date(Date.now()-i*86400000).toISOString().slice(0,10)).reverse();
    let html = '<div class="calendar-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:8px;">';
    for (let d of last30) {
      const studied = studyLog.some(l => l.date === d);
      html += `<div style="background:${studied?'#00d4ff':'#333'}; border-radius:12px; padding:8px; text-align:center;">${d.slice(5)}</div>`;
    }
    html += '</div>';
    document.getElementById('studioCalendar').innerHTML = html;
  }

  function renderProfile() {
    document.getElementById('studioProfile').innerHTML = `<div class="dashboard-card"><h3>👤 Perfil</h3><input id="profileName" value="${userProfile.name}" class="search-input"><button id="saveProfile" class="search-btn">Salvar</button><p>XP: ${userProfile.xp} | Nível: ${userProfile.level}</p></div>`;
    document.getElementById('saveProfile')?.addEventListener('click', () => { userProfile.name = document.getElementById('profileName').value; saveAllData(); showToast('Perfil atualizado'); });
  }

  function renderExport() {
    document.getElementById('studioExport').innerHTML = `<div class="dashboard-grid"><button id="exportJSON" class="search-btn">Exportar JSON</button><button id="exportCSV" class="search-btn">Exportar CSV</button></div>`;
    document.getElementById('exportJSON')?.addEventListener('click', () => {
      const data = { readArticles: [...readArticles], readBooks: [...readBooks], readResearch: [...readResearch], favorites, notes, collections, tags, userProfile, goals, studyLog };
      const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'readplus_data.json'; a.click();
    });
    document.getElementById('exportCSV')?.addEventListener('click', () => {
      let csv = "type,id,title\n";
      [...readArticles].forEach(id => { const a = articlesData.find(a=>a.id===id); csv += `article,${id},"${a?.title || ''}"\n`; });
      const blob = new Blob([csv], {type:'text/csv'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'readplus_reads.csv'; a.click();
    });
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  function switchMainTab(tab) { currentMainTab = tab; if (tab === 'articles') renderArticlesTab(); else if (tab === 'books') renderBooksTab(); else if (tab === 'research') renderResearchTab(); else renderStudioTab(); }
  function initMainTabs() { document.querySelectorAll('.main-tab').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); switchMainTab(btn.dataset.main); }); }); switchMainTab('articles'); }
  initMainTabs();
</script>
