<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READ+ · Buscador Acadêmico</title>
    <!-- Favicon inline -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <style>
        /* ========== RESET E VARIÁVEIS ========== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-deep: #0F172A;
            --bg-card: rgba(15, 23, 42, 0.85);
            --bg-glass: rgba(255,255,255,0.04);
            --border-glass: rgba(255,255,255,0.08);
            --cyan: #06B6D4;
            --cyan-glow: rgba(6,182,212,0.35);
            --purple: #8B5CF6;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --radius: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            background: var(--bg-deep);
            background-image: radial-gradient(circle at 30% 20%, rgba(6,182,212,0.06) 0%, transparent 50%),
                              radial-gradient(circle at 70% 80%, rgba(139,92,246,0.05) 0%, transparent 50%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
            line-height: 1.6;
        }
        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 0.5rem;
        }

        /* ========== HEADER ========== */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }
        .brand .logo {
            font-weight: 700;
            font-size: clamp(1.4rem, 5vw, 2rem);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand .logo-plus {
            font-weight: 300;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            color: var(--cyan);
            -webkit-text-fill-color: var(--cyan);
        }
        .brand .slogan {
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            font-weight: 300;
            color: var(--text-secondary);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 0.75rem;
            display: none;
        }
        @media (min-width: 640px) { .brand .slogan { display: inline-block; } }

        .header-actions .btn-icon {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-secondary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .header-actions .btn-icon:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--cyan);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        /* ========== ÁREA DE BUSCA ========== */
        .search-zone {
            margin: 2rem 0 1.5rem;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: clamp(1.2rem, 3vw, 2rem);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        .search-input-wrap {
            flex: 1;
            min-width: 180px;
        }
        .search-input-wrap input {
            width: 100%;
            padding: clamp(0.7rem, 2vw, 0.9rem) clamp(1rem, 2vw, 1.2rem);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.3);
            color: var(--text-primary);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            font-family: var(--font-sans);
            transition: var(--transition);
            outline: none;
        }
        .search-input-wrap input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }
        .search-input-wrap input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 4px var(--cyan-glow);
            background: rgba(0,0,0,0.5);
        }
        .btn-search {
            padding: clamp(0.7rem, 2vw, 0.9rem) clamp(1.2rem, 3vw, 2rem);
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--cyan), #0891B2);
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1rem);
            font-family: var(--font-sans);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px var(--cyan-glow);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        .btn-search:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 30px var(--cyan-glow);
        }
        .btn-search:active { transform: scale(0.97); }
        .btn-search .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-search.loading .spinner { display: inline-block; }
        .btn-search.loading .search-label { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-height: 1.5rem;
        }

        /* ========== GRID DE RESULTADOS ========== */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        /* ========== CARD ========== */
        .result-card {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .result-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(6,182,212,0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        .result-card .card-title {
            font-size: clamp(1rem, 2vw, 1.1rem);
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
        }
        .result-card .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .result-card .card-meta .year { color: var(--cyan); }
        .result-card .card-meta .citations { color: var(--purple); }
        .result-card .card-footer {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-card .card-footer .pdf-hint {
            color: var(--cyan);
            font-weight: 500;
        }
        .result-card .card-footer .source {
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== ESTADO VAZIO ========== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .empty-state .empty-suggestion {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* ========== FOOTER ========== */
        .app-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .search-row .btn-search { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand">
            <span class="logo">READ<span class="logo-plus">+</span></span>
            <span class="slogan">Buscador Acadêmico</span>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="themeToggle" aria-label="Alternar tema">🌓</button>
        </div>
    </header>

    <!-- BUSCA -->
    <section class="search-zone">
        <div class="search-row">
            <div class="search-input-wrap">
                <input type="text" id="searchInput" placeholder="Pesquise por tema, autor ou título…" />
            </div>
            <button class="btn-search" id="searchBtn">
                <span class="search-label">🔍 Buscar</span>
                <span class="spinner"></span>
            </button>
        </div>
        <div class="status-message" id="statusMessage"></div>
    </section>

    <!-- RESULTADOS -->
    <div id="resultsGrid" class="results-grid">
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>Pesquise um tema para encontrar artigos acadêmicos</p>
            <p class="empty-suggestion">Ex: "aprendizado de máquina", "filosofia", "redes neurais"</p>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>READ+ · Busca em repositórios acadêmicos (CORE + Crossref)</p>
    </footer>
</div>

<!-- ========== JAVASCRIPT ========== -->
<script>
    (function() {
        'use strict';

        // ==================== DOM REFS ====================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const statusMessage = document.getElementById('statusMessage');
        const themeToggle = document.getElementById('themeToggle');

        // ==================== FUNÇÕES AUXILIARES ====================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderResults(data, query) {
            resultsGrid.innerHTML = '';

            if (!data || data.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>Nenhum resultado encontrado para "${escapeHtml(query)}"</p>
                        <p class="empty-suggestion">Tente outras palavras-chave ou verifique sua conexão.</p>
                    </div>
                `;
                statusMessage.textContent = 'Nenhum resultado encontrado.';
                return;
            }

            statusMessage.textContent = `${data.length} resultado${data.length > 1 ? 's' : ''} encontrado${data.length > 1 ? 's' : ''} para "${escapeHtml(query)}".`;

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.style.animationDelay = `${index * 40}ms`;

                // Determina o link
                const link = item.pdf_url || item.url || '#';

                card.addEventListener('click', function(e) {
                    if (e.target.closest('button')) return;
                    if (link && link !== '#') {
                        window.open(link, '_blank');
                    } else {
                        alert('Link não disponível para este item.');
                    }
                });

                // Tipo de material
                let type = '📄 Artigo';
                if (item.type && item.type.toLowerCase().includes('book')) type = '📚 Livro';
                else if (item.type && item.type.toLowerCase().includes('thesis')) type = '📝 Tese';

                card.innerHTML = `
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    <div class="card-meta">
                        <span>${escapeHtml(item.authors || 'Autor desconhecido')}</span>
                        <span class="year">${item.year || '–'}</span>
                        <span class="citations">⭐ ${item.cited_by_count || 0} citações</span>
                    </div>
                    <div class="card-footer">
                        <span class="source">${escapeHtml(item.source || 'Fonte não informada')}</span>
                        <span class="pdf-hint">${item.pdf_url ? '📄 Abrir PDF' : type}</span>
                    </div>
                `;
                resultsGrid.appendChild(card);
            });
        }

        // ==================== BUSCA NA API CORE ====================
        async function searchCORE(query) {
            if (!query || query.trim() === '') {
                resultsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>Digite um tema para buscar</p>
                        <p class="empty-suggestion">Ex: "aprendizado de máquina", "filosofia", "redes neurais"</p>
                    </div>
                `;
                statusMessage.textContent = 'Digite um termo para buscar.';
                return;
            }

            searchBtn.classList.add('loading');
            searchBtn.disabled = true;
            statusMessage.textContent = 'Buscando...';

            try {
                // Usando a API CORE (gratuita, sem chave para busca básica)
                const encodedQuery = encodeURIComponent(query.trim());
                // CORE API - busca em repositórios acadêmicos
                const url = `https://api.core.ac.uk/v3/search/works?q=${encodedQuery}&limit=20`;

                console.log('🔎 Buscando CORE:', url);

                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                console.log('📦 Dados CORE recebidos:', data);

                if (!data.results || data.results.length === 0) {
                    // Tentar fallback para Crossref
                    console.log('⚠️ Sem resultados no CORE, tentando Crossref...');
                    await searchCrossref(query);
                    return;
                }

                const formatted = data.results.map(item => {
                    // Extrair autores
                    let authors = 'Autor desconhecido';
                    if (item.authors && item.authors.length > 0) {
                        authors = item.authors.map(a => a.name).join(', ');
                    }

                    // Extrair ano
                    let year = null;
                    if (item.publicationDate) {
                        year = item.publicationDate.substring(0, 4);
                    }

                    // Extrair fonte
                    let source = item.publisher || item.journal?.name || 'Fonte não informada';

                    // Verificar se tem PDF
                    let pdf_url = null;
                    if (item.downloadUrl) {
                        pdf_url = item.downloadUrl;
                    } else if (item.fullTextUrl) {
                        pdf_url = item.fullTextUrl;
                    } else if (item.locations && item.locations.length > 0) {
                        const pdfLoc = item.locations.find(l => l.pdfUrl);
                        if (pdfLoc) pdf_url = pdfLoc.pdfUrl;
                    }

                    return {
                        title: item.title || 'Título não disponível',
                        authors: authors,
                        year: year,
                        source: source,
                        cited_by_count: item.citationCount || 0,
                        pdf_url: pdf_url,
                        url: item.url || null,
                        type: item.type || 'article'
                    };
                });

                renderResults(formatted, query);

            } catch (error) {
                console.error('❌ Erro na busca CORE:', error);
                // Fallback para Crossref
                console.log('🔄 Tentando fallback para Crossref...');
                await searchCrossref(query);
            } finally {
                searchBtn.classList.remove('loading');
                searchBtn.disabled = false;
            }
        }

        // ==================== FALLBACK: BUSCA NA CROSSREF ====================
        async function searchCrossref(query) {
            try {
                const encodedQuery = encodeURIComponent(query.trim());
                const url = `https://api.crossref.org/works?query=${encodedQuery}&rows=20&sort=relevance`;

                console.log('🔎 Buscando Crossref:', url);

                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                console.log('📦 Dados Crossref recebidos:', data);

                if (!data.message || !data.message.items || data.message.items.length === 0) {
                    renderResults([], query);
                    return;
                }

                const formatted = data.message.items.map(item => {
                    // Extrair autores
                    let authors = 'Autor desconhecido';
                    if (item.author && item.author.length > 0) {
                        authors = item.author.map(a => a.given + ' ' + a.family).join(', ');
                    }

                    // Extrair ano
                    let year = null;
                    if (item.issued && item.issued['date-parts'] && item.issued['date-parts'][0]) {
                        year = item.issued['date-parts'][0][0];
                    }

                    // Extrair fonte
                    let source = item['container-title'] || item.publisher || 'Fonte não informada';
                    if (Array.isArray(source)) source = source[0];

                    // Verificar se tem PDF
                    let pdf_url = null;
                    if (item.link && item.link.length > 0) {
                        const pdfLink = item.link.find(l => l.contentType === 'application/pdf' || l.intendedApplication === 'text-mining');
                        if (pdfLink) pdf_url = pdfLink.URL;
                    }
                    if (!pdf_url && item.URL) {
                        pdf_url = item.URL;
                    }

                    return {
                        title: item.title ? item.title[0] : 'Título não disponível',
                        authors: authors,
                        year: year,
                        source: source,
                        cited_by_count: item['is-referenced-by-count'] || 0,
                        pdf_url: pdf_url,
                        url: item.URL || null,
                        type: item.type || 'article'
                    };
                });

                renderResults(formatted, query);

            } catch (error) {
                console.error('❌ Erro na busca Crossref:', error);
                statusMessage.textContent = 'Erro ao buscar. Verifique sua conexão.';
                resultsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Erro ao buscar resultados</p>
                        <p class="empty-suggestion">Verifique sua conexão com a internet e tente novamente.</p>
                    </div>
                `;
            }
        }

        // ==================== FUNÇÃO PRINCIPAL ====================
        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                statusMessage.textContent = 'Digite um termo para buscar.';
                return;
            }
            searchCORE(query);
        }

        // ==================== EVENTOS ====================
        searchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            performSearch();
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // ==================== TEMA ====================
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            const isDark = !document.body.classList.contains('light-theme');
            document.documentElement.style.setProperty('--bg-deep', isDark ? '#0F172A' : '#F8FAFC');
            document.documentElement.style.setProperty('--text-primary', isDark ? '#F1F5F9' : '#0F172A');
            document.documentElement.style.setProperty('--text-secondary', isDark ? '#94A3B8' : '#475569');
            document.documentElement.style.setProperty('--text-muted', isDark ? '#64748B' : '#94A3B8');
        });

        // ==================== INICIALIZAÇÃO ====================
        console.log('🚀 READ+ Online iniciado!');
        console.log('📚 Buscando via CORE API + fallback Crossref');

        // Mensagem inicial
        statusMessage.textContent = 'Digite um termo e clique em Buscar.';

    })();
</script>
</body>
</html>
