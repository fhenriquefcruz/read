<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>READ+ · Buscador Acadêmico</title>
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <!-- Dados -->
  <script src="data.js" defer></script>
  <!-- Aplicação -->
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="brand">
        <span class="logo">READ<span class="logo-plus">+</span></span>
        <span class="slogan">Cubo de Insights</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="themeToggle" aria-label="Alternar tema">🌓</button>
      </div>
    </header>

    <!-- Área de Busca -->
    <section class="search-zone">
      <div class="search-row">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="Pesquise por título, autor ou ano…" />
        </div>
        <button class="btn-search" id="searchBtn">
          <span class="search-label">🔍 Buscar</span>
          <span class="spinner"></span>
        </button>
      </div>
      <!-- Contador e mensagem de estado -->
      <div id="statusMessage" class="status-message"></div>
    </section>

    <!-- Resultados -->
    <div id="resultsGrid" class="results-grid">
      <!-- Os cards serão injetados aqui via JS -->
    </div>

    <!-- Rodapé (opcional) -->
    <footer class="app-footer">
      <p>READ+ · Curadoria de conhecimento</p>
    </footer>
  </div>
</body>
</html>
