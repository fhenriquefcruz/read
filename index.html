<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READ+ Buscador</title>
  <style>
    /* Reset básico */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F172A;
      color: #F1F5F9;
      font-family: system-ui, sans-serif;
      padding: 2rem;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #06B6D4, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .search-box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 20px;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .search-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .search-row input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1rem;
      min-width: 200px;
      outline: none;
    }
    .search-row input:focus {
      border-color: #06B6D4;
      box-shadow: 0 0 0 3px rgba(6,182,212,0.3);
    }
    .search-row button {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #06B6D4, #0891B2);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      white-space: nowrap;
    }
    .search-row button:hover {
      transform: scale(1.02);
    }
    .status {
      margin-top: 0.8rem;
      color: #94A3B8;
      font-size: 0.9rem;
      min-height: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(6,182,212,0.3);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.8rem;
      color: #94A3B8;
    }
    .card .meta .ano { color: #06B6D4; }
    .card .meta .citas { color: #8B5CF6; }
    .card .footer {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #64748B;
    }
    .card .footer .pdf { color: #06B6D4; font-weight: 500; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #64748B;
    }
    .empty .icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
    .footer {
      margin-top: 2rem;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="logo">READ+</div>
    <button id="themeToggle" style="background:transparent;border:1px solid rgba(255,255,255,0.1);color:#94A3B8;padding:0.3rem 1rem;border-radius:20px;cursor:pointer;">🌓</button>
  </header>

  <section class="search-box">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Digite título, autor ou ano…">
      <button id="searchBtn">🔍 Buscar</button>
    </div>
    <div class="status" id="statusMessage"></div>
  </section>

  <div id="resultsGrid" class="grid"></div>

  <footer class="footer">READ+ · Curadoria de conhecimento</footer>
</div>

<script>
  (function() {
    'use strict';

    // ========== DADOS ==========
    const DATA = [
      { titulo: "Transformers for NLP", autores: "Vaswani et al.", ano: 2023, fonte: "arXiv", citacoes: 1847, pdf: "https://arxiv.org/pdf/1706.03762.pdf" },
      { titulo: "Deep Learning for Computer Vision", autores: "Krizhevsky et al.", ano: 2022, fonte: "CVPR", citacoes: 932, pdf: "https://papers.nips.cc/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf" },
      { titulo: "Reinforcement Learning: An Introduction", autores: "Sutton, Barto", ano: 2020, fonte: "MIT Press", citacoes: 5100, pdf: "http://incompleteideas.net/book/RLbook2020.pdf" },
      { titulo: "BERT: Pre-training of Transformers", autores: "Devlin et al.", ano: 2021, fonte: "NAACL", citacoes: 6021, pdf: "https://arxiv.org/pdf/1810.04805.pdf" },
      { titulo: "The Elements of Statistical Learning", autores: "Hastie et al.", ano: 2019, fonte: "Springer", citacoes: 12450, pdf: "https://web.stanford.edu/~hastie/ElemStatLearn/printings/ESLII_print12.pdf" },
      { titulo: "Attention Is All You Need", autores: "Vaswani et al.", ano: 2023, fonte: "NeurIPS", citacoes: 8700, pdf: "https://arxiv.org/pdf/1706.03762.pdf" },
      { titulo: "Generative Adversarial Networks", autores: "Goodfellow et al.", ano: 2020, fonte: "ArXiv", citacoes: 3500, pdf: "https://arxiv.org/pdf/1406.2661.pdf" },
      { titulo: "Pattern Recognition and Machine Learning", autores: "Bishop", ano: 2021, fonte: "Springer", citacoes: 2100, pdf: "https://www.microsoft.com/en-us/research/uploads/prod/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf" }
    ];

    console.log('📚 Dados carregados:', DATA.length);

    // ========== DOM ==========
    const input = document.getElementById('searchInput');
    const btn = document.getElementById('searchBtn');
    const grid = document.getElementById('resultsGrid');
    const status = document.getElementById('statusMessage');

    // ========== FUNÇÕES ==========
    function render(items, term) {
      grid.innerHTML = '';
      if (!items || items.length === 0) {
        grid.innerHTML = `<div class="empty"><span class="icon">🔍</span><p>Nenhum material encontrado</p><p style="font-size:0.9rem;color:#94A3B8;">Tente outras palavras-chave.</p></div>`;
        status.textContent = 'Nenhum resultado encontrado.';
        return;
      }
      status.textContent = `${items.length} resultado${items.length > 1 ? 's' : ''}${term ? ' para "' + term + '"' : ''}.`;
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${item.titulo}</h3>
          <div class="meta">
            <span>${item.autores}</span>
            <span class="ano">${item.ano}</span>
            <span class="citas">⭐ ${item.citacoes}</span>
          </div>
          <div class="footer">
            <span>${item.fonte}</span>
            <span class="pdf">📄 Abrir PDF</span>
          </div>
        `;
        card.addEventListener('click', () => {
          if (item.pdf) window.open(item.pdf, '_blank');
          else alert('PDF não disponível.');
        });
        grid.appendChild(card);
      });
    }

    function search() {
      const raw = input.value;
      const query = raw.trim();
      console.log('🔎 Buscando por:', query);

      if (query === '') {
        render(DATA, '');
        status.textContent = `${DATA.length} itens disponíveis.`;
        return;
      }

      const lower = query.toLowerCase();
      const filtered = DATA.filter(item => {
        const matchTitle = item.titulo.toLowerCase().includes(lower);
        const matchAuthor = item.autores.toLowerCase().includes(lower);
        const matchYear = String(item.ano).includes(lower);
        return matchTitle || matchAuthor || matchYear;
      });

      console.log('✅ Encontrados:', filtered.length);
      render(filtered, query);
    }

    // ========== EVENTOS ==========
    btn.addEventListener('click', search);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    // ========== TEMA ==========
    document.getElementById('themeToggle').addEventListener('click', function() {
      const isDark = document.body.style.background !== '#F8FAFC';
      document.body.style.background = isDark ? '#F8FAFC' : '#0F172A';
      document.body.style.color = isDark ? '#0F172A' : '#F1F5F9';
      document.querySelectorAll('.card').forEach(c => {
        c.style.background = isDark ? 'rgba(255,255,255,0.9)' : 'rgba(15,23,42,0.8)';
        c.style.color = isDark ? '#0F172A' : '#F1F5F9';
      });
    });

    // ========== INICIALIZAÇÃO ==========
    render(DATA, '');
    status.textContent = `${DATA.length} itens disponíveis.`;
    console.log('🚀 READ+ pronto!');
  })();
</script>
</body>
</html>
