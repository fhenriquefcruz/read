<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0a0f1c">
  <title>Read+ · Hub do Conhecimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #05070f;
      --bg-card: rgba(12, 18, 28, 0.65);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent: #00d4ff;
      --text-primary: #f0f3fa;
      --text-secondary: #9aa4bf;
      --border-light: rgba(0, 212, 255, 0.2);
      --shadow-neon: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0a0f1c, #02040c);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* overlay de fundo com grid futurista */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        linear-gradient(var(--border-light) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: 0.2;
      z-index: 0;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* cabeçalho com logo neon */
    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }
    .logo {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff, var(--glow-primary), var(--glow-secondary));
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0,212,255,0.4);
      display: inline-block;
      animation: flicker 3s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(0,212,255,0.4);}
      50% { opacity: 0.95; text-shadow: 0 0 30px rgba(0,212,255,0.8);}
    }
    .logo span {
      font-size: 1rem;
      vertical-align: super;
      background: none;
      background-clip: unset;
      color: var(--glow-primary);
      font-weight: 500;
    }
    .tagline {
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* abas principais */
    .main-tabs {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }
    .main-tab {
      background: none;
      border: none;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 60px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.3s;
      backdrop-filter: blur(4px);
      letter-spacing: 0.5px;
    }
    .main-tab.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,44,191,0.2));
      color: var(--glow-primary);
      box-shadow: var(--shadow-neon);
      border: 1px solid var(--glow-primary);
    }
    .main-tab:hover:not(.active) {
      color: white;
      background: rgba(0,212,255,0.1);
    }

    /* card principal glass */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      border: 1px solid var(--border-light);
      padding: 28px 32px;
      transition: all 0.3s;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
    }

    /* sub abas (dentro de Artigos) */
    .sub-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .sub-tab {
      background: none;
      border: none;
      padding: 6px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 40px;
      color: var(--text-secondary);
      transition: 0.2s;
    }
    .sub-tab.active {
      background: var(--glow-primary);
      color: #02040c;
      box-shadow: 0 0 10px var(--glow-primary);
    }
    .sub-content {
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .sub-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* campo de busca */
    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      padding: 14px 22px;
      border-radius: 60px;
      border: 1px solid var(--border-light);
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--glow-primary);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.3);
    }
    .search-btn {
      background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary));
      border: none;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }
    .search-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    /* resultados */
    .results-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 60px;
      padding: 6px 20px;
    }
    .progress-ring {
      width: 44px; height: 44px;
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      stroke: var(--glow-primary);
      fill: none;
      stroke-width: 3;
    }
    .action-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }
    .action-btn:hover {
      background: var(--glow-primary);
      color: #02040c;
    }
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 550px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .result-card {
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 18px;
      transition: all 0.2s;
      border: 1px solid rgba(0,212,255,0.2);
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .result-card:hover {
      transform: translateX(6px);
      border-color: var(--glow-primary);
      box-shadow: 0 0 15px rgba(0,212,255,0.2);
    }
    .checkbox {
      width: 24px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border: 2px solid var(--glow-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .checkbox.checked {
      background: var(--glow-primary);
      color: black;
    }
    .card-content {
      flex: 1;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--glow-primary);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .card-abstract {
      font-size: 0.85rem;
      margin: 8px 0;
      opacity: 0.9;
      line-height: 1.4;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,212,255,0.2);
      padding: 5px 12px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      color: white;
      transition: 0.2s;
    }
    .btn-link:hover {
      background: var(--glow-primary);
      color: #02040c;
    }
    .loader {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0,212,255,0.3);
      border-top-color: var(--glow-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    @media (max-width: 700px) {
      .glass-card { padding: 18px; }
      .main-tab { padding: 8px 16px; font-size: 1rem; }
      .result-card { flex-direction: column; }
      .search-area { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Read <span>+</span></div>
    <div class="tagline">hub de conhecimento | artigos | livros | pesquisas</div>
  </div>

  <!-- abas principais -->
  <div class="main-tabs">
    <button class="main-tab active" data-main="articles">📄 Artigos</button>
    <button class="main-tab" data-main="books">📚 Livros</button>
    <button class="main-tab" data-main="research">🔬 Pesquisas</button>
  </div>

  <div class="glass-card">
    <!-- conteúdo dinâmico via JS -->
    <div id="mainContent"></div>
  </div>
  <div class="footer">
    <span>🔎 Fontes: OpenAlex (artigos/pesquisas) · Google Books (livros) · dados abertos</span>
  </div>
</div>

<script>
  // ---------- ESTADO GLOBAL ----------
  let currentMainTab = 'articles';
  let articlesData = [];      // lista de artigos (para checkbox e "meus lidos")
  let readArticles = new Set();  // ids dos artigos lidos

  // Carregar salvos
  function loadReadStatus() {
    const stored = localStorage.getItem('readplus_read');
    if (stored) readArticles = new Set(JSON.parse(stored));
  }
  function saveReadStatus() {
    localStorage.setItem('readplus_read', JSON.stringify([...readArticles]));
  }

  // ---------- FUNÇÕES DE BUSCA ----------
  async function searchArticles(query) {
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=open_access.is_oa:true&sort=relevance_score:desc&per-page=14`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results.map(work => ({
      id: btoa(work.id).replace(/[^a-zA-Z0-9]/g, ''),
      title: work.title || 'Sem título',
      authors: work.authorships?.map(a => a.author.display_name) || [],
      abstract: work.abstract || 'Resumo não disponível.',
      url: work.open_access?.oa_url || work.best_oa_location?.pdf_url || work.id,
      source: 'OpenAlex'
    }));
  }

  async function searchBooks(query) {
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=14&filter=paid-ebooks?`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.items) return [];
    return data.items.map(item => ({
      id: item.id,
      title: item.volumeInfo.title,
      authors: item.volumeInfo.authors || ['Autor não informado'],
      abstract: item.volumeInfo.description || 'Sinopse não disponível.',
      url: item.volumeInfo.previewLink || item.volumeInfo.infoLink,
      source: 'Google Books'
    }));
  }

  async function searchResearch(query) {
    // usa openAlex com filtro de tipo de trabalho (article, report)
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=type:article,type:report&sort=relevance_score:desc&per-page=12`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results.map(work => ({
      id: btoa(work.id).replace(/[^a-zA-Z0-9]/g, ''),
      title: work.title || 'Sem título',
      authors: work.authorships?.map(a => a.author.display_name) || [],
      abstract: work.abstract || 'Resumo não disponível.',
      url: work.open_access?.oa_url || work.best_oa_location?.pdf_url || work.id,
      source: 'OpenAlex (research)'
    }));
  }

  // ---------- RENDERIZAÇÃO DE CADA ABA PRINCIPAL ----------
  function renderArticlesTab() {
    const html = `
      <div class="sub-tabs">
        <button class="sub-tab active" data-sub="search">🔍 Buscar artigos</button>
        <button class="sub-tab" data-sub="read">✅ Meus lidos</button>
      </div>
      <div id="articlesSearchSub" class="sub-content active">
        <div class="search-area">
          <input type="text" id="articlesQuery" class="search-input" placeholder="Ex: machine learning ethics, theology, climate adaptation...">
          <button id="articlesSearchBtn" class="search-btn">🔍 Pesquisar</button>
        </div>
        <div id="articlesResults"></div>
      </div>
      <div id="articlesReadSub" class="sub-content">
        <div id="readListContainer" class="results-grid"></div>
      </div>
    `;
    document.getElementById('mainContent').innerHTML = html;

    // eventos das sub-abas
    document.querySelectorAll('.sub-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-sub');
        document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.sub-content').forEach(c => c.classList.remove('active'));
        if (target === 'search') {
          document.getElementById('articlesSearchSub').classList.add('active');
        } else {
          document.getElementById('articlesReadSub').classList.add('active');
          renderReadArticles();
        }
      });
    });

    document.getElementById('articlesSearchBtn').addEventListener('click', async () => {
      const query = document.getElementById('articlesQuery').value.trim();
      if (!query) return;
      const resultsDiv = document.getElementById('articlesResults');
      resultsDiv.innerHTML = `<div class="loader"><div class="spinner"></div>🔎 Buscando artigos...</div>`;
      const articles = await searchArticles(query);
      articlesData = articles;
      if (!articles.length) {
        resultsDiv.innerHTML = `<div class="no-results">😕 Nenhum artigo encontrado.</div>`;
        return;
      }
      renderArticlesList(articles);
    });
  }

  function renderArticlesList(articles) {
    const resultsDiv = document.getElementById('articlesResults');
    const readCount = articles.filter(a => readArticles.has(a.id)).length;
    resultsDiv.innerHTML = `
      <div class="results-stats">
        <div style="display:flex; align-items:center; gap:12px;">
          <svg class="progress-ring" width="44" height="44">
            <circle class="progress-ring-circle" cx="22" cy="22" r="18" stroke-width="3" fill="none" stroke="currentColor" stroke-dasharray="113.1" stroke-dashoffset="${113.1 * (1 - (readCount / articles.length || 0))}"></circle>
          </svg>
          <span>${readCount} / ${articles.length} lidos</span>
        </div>
        <div>
          <button id="markAllArticlesBtn" class="action-btn">✅ Marcar todos</button>
          <button id="clearAllArticlesBtn" class="action-btn">🗑️ Limpar leituras</button>
        </div>
      </div>
      <div id="articlesList" class="results-grid"></div>
    `;
    const listDiv = document.getElementById('articlesList');
    listDiv.innerHTML = articles.map(art => `
      <div class="result-card" data-id="${art.id}">
        <div class="checkbox ${readArticles.has(art.id) ? 'checked' : ''}" data-id="${art.id}">${readArticles.has(art.id) ? '✓' : ''}</div>
        <div class="card-content">
          <a href="${art.url}" target="_blank" class="card-title">📄 ${escapeHtml(art.title)}</a>
          <div class="card-meta">${art.authors.slice(0,3).join(', ') || 'Autor(es) não informado'} · ${art.source}</div>
          <div class="card-abstract">${escapeHtml(art.abstract.substring(0, 260))}…</div>
          ${art.url ? `<a href="${art.url}" target="_blank" class="btn-link">📖 Acessar</a>` : ''}
        </div>
      </div>
    `).join('');

    // checkboxes
    document.querySelectorAll('.checkbox').forEach(cb => {
      cb.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = cb.getAttribute('data-id');
        if (readArticles.has(id)) {
          readArticles.delete(id);
          cb.classList.remove('checked');
          cb.innerText = '';
        } else {
          readArticles.add(id);
          cb.classList.add('checked');
          cb.innerText = '✓';
        }
        saveReadStatus();
        renderArticlesList(articles);  // re-render para atualizar contador
        renderReadArticles();          // atualiza aba "meus lidos"
      });
    });

    document.getElementById('markAllArticlesBtn').addEventListener('click', () => {
      articles.forEach(a => readArticles.add(a.id));
      saveReadStatus();
      renderArticlesList(articles);
      renderReadArticles();
    });
    document.getElementById('clearAllArticlesBtn').addEventListener('click', () => {
      articles.forEach(a => readArticles.delete(a.id));
      saveReadStatus();
      renderArticlesList(articles);
      renderReadArticles();
    });
  }

  function renderReadArticles() {
    const container = document.getElementById('readListContainer');
    const readItems = articlesData.filter(a => readArticles.has(a.id));
    if (!readItems.length) {
      container.innerHTML = `<div class="no-results">📭 Nenhum artigo lido ainda. Marque ✓ nos artigos da busca.</div>`;
      return;
    }
    container.innerHTML = readItems.map(art => `
      <div class="result-card">
        <div class="card-content">
          <a href="${art.url}" target="_blank" class="card-title">📄 ${escapeHtml(art.title)}</a>
          <div class="card-meta">${art.authors.slice(0,3).join(', ')}</div>
          <div class="card-abstract">${escapeHtml(art.abstract.substring(0, 200))}…</div>
          <button class="action-btn unread-btn" data-id="${art.id}" style="margin-top:8px;">🗑️ Remover dos lidos</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.unread-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        readArticles.delete(id);
        saveReadStatus();
        renderReadArticles();
        if (document.querySelector('.sub-tab.active')?.getAttribute('data-sub') === 'search') {
          // re-render da busca ativa (se houver artigos exibidos)
          const query = document.getElementById('articlesQuery')?.value;
          if (query && articlesData.length) renderArticlesList(articlesData);
        }
      });
    });
  }

  // Livros
  async function renderBooksTab() {
    document.getElementById('mainContent').innerHTML = `
      <div class="search-area">
        <input type="text" id="booksQuery" class="search-input" placeholder="Ex: ficção científica, biografia, programação...">
        <button id="booksSearchBtn" class="search-btn">🔍 Buscar livros</button>
      </div>
      <div id="booksResults"></div>
    `;
    document.getElementById('booksSearchBtn').addEventListener('click', async () => {
      const query = document.getElementById('booksQuery').value.trim();
      if (!query) return;
      const resultsDiv = document.getElementById('booksResults');
      resultsDiv.innerHTML = `<div class="loader"><div class="spinner"></div>📚 Buscando livros...</div>`;
      const books = await searchBooks(query);
      if (!books.length) {
        resultsDiv.innerHTML = `<div class="no-results">😕 Nenhum livro encontrado.</div>`;
        return;
      }
      resultsDiv.innerHTML = `
        <div class="results-grid">
          ${books.map(b => `
            <div class="result-card">
              <div class="card-content">
                <a href="${b.url}" target="_blank" class="card-title">📖 ${escapeHtml(b.title)}</a>
                <div class="card-meta">${b.authors.join(', ')} · ${b.source}</div>
                <div class="card-abstract">${escapeHtml(b.abstract.substring(0, 200))}…</div>
                <a href="${b.url}" target="_blank" class="btn-link">🔗 Visualizar</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    });
  }

  // Pesquisas
  async function renderResearchTab() {
    document.getElementById('mainContent').innerHTML = `
      <div class="search-area">
        <input type="text" id="researchQuery" class="search-input" placeholder="Ex: inteligência artificial, mudanças climáticas...">
        <button id="researchSearchBtn" class="search-btn">🔍 Buscar pesquisas</button>
      </div>
      <div id="researchResults"></div>
    `;
    document.getElementById('researchSearchBtn').addEventListener('click', async () => {
      const query = document.getElementById('researchQuery').value.trim();
      if (!query) return;
      const resultsDiv = document.getElementById('researchResults');
      resultsDiv.innerHTML = `<div class="loader"><div class="spinner"></div>🔬 Buscando estudos...</div>`;
      const research = await searchResearch(query);
      if (!research.length) {
        resultsDiv.innerHTML = `<div class="no-results">😕 Nenhuma pesquisa encontrada.</div>`;
        return;
      }
      resultsDiv.innerHTML = `
        <div class="results-grid">
          ${research.map(r => `
            <div class="result-card">
              <div class="card-content">
                <a href="${r.url}" target="_blank" class="card-title">📑 ${escapeHtml(r.title)}</a>
                <div class="card-meta">${r.authors.slice(0,3).join(', ')} · ${r.source}</div>
                <div class="card-abstract">${escapeHtml(r.abstract.substring(0, 260))}…</div>
                <a href="${r.url}" target="_blank" class="btn-link">📖 Ler estudo</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    });
  }

  // Controle de abas principais
  function switchMainTab(tab) {
    currentMainTab = tab;
    if (tab === 'articles') renderArticlesTab();
    else if (tab === 'books') renderBooksTab();
    else if (tab === 'research') renderResearchTab();
  }

  function initMainTabs() {
    document.querySelectorAll('.main-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        switchMainTab(btn.getAttribute('data-main'));
      });
    });
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  loadReadStatus();
  initMainTabs();
