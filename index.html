<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#03050a">
  <title>READ +</title>
  <link rel="manifest" href="./manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========== DESIGN SYSTEM: NEURAL DISRUPTION & HIGH-END DESIGN ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #03050a;
      --bg-card: rgba(6, 11, 20, 0.85);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent-neon: #00ffcc;
      --text-primary: #f0f3fa;
      --text-secondary: #8a96b5;
      --border-glow: rgba(0, 212, 255, 0.1);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 32px);
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND CONCEITUAL: MALHA SINÁPTICA EM PROCESSAMENTO */
    .neural-network-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: 
        radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 191, 0.08) 0%, transparent 50%);
    }
    .neural-network-bg::before {
      content: "";
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background-image: 
        radial-gradient(rgba(0, 212, 255, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(123, 44, 191, 0.08) 1.5px, transparent 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      animation: neuralProcessing 20s ease-in-out infinite;
    }
    @keyframes neuralProcessing {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
      50% { transform: translate(10px, -20px) rotate(1deg); opacity: 0.8; }
      100% { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
    }

    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; width: 100%; }
    .header { text-align: left; margin-bottom: 40px; max-width: 900px; }
    
    /* LOGO "READ +" TOTALMENTE ASSIMÉTRICO E CONCEITUAL */
    .logo-concept {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      margin-bottom: 16px;
      user-select: none;
    }
    .logo-char {
      font-size: clamp(3rem, 7vw, 4.8rem);
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 0.75;
      display: inline-block;
    }
    /* Desconstrução Assimétrica das Letras */
    .logo-char:nth-child(1) { font-weight: 200; transform: translateY(6px) scaleY(0.95); letter-spacing: -6px; }
    .logo-char:nth-child(2) { font-weight: 900; transform: translateY(-4px) rotate(-2deg); letter-spacing: -4px; }
    .logo-char:nth-child(3) { font-weight: 400; transform: translateY(2px) scale(1.05); letter-spacing: -5px; }
    .logo-char:nth-child(4) { font-weight: 800; transform: translateY(-1px); letter-spacing: 0; }

    .logo-synapse {
      font-weight: 300;
      color: var(--glow-primary);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.8), 0 0 60px rgba(123, 44, 191, 0.5);
      transform: translateY(-12px) rotate(4deg);
      margin-left: 10px;
      animation: synapsePulse 3s infinite ease-in-out;
    }
    @keyframes synapsePulse {
      0%, 100% { opacity: 0.8; transform: translateY(-12px) scale(1); }
      50% { opacity: 1; transform: translateY(-12px) scale(1.1); text-shadow: 0 0 40px var(--glow-primary); }
    }
    
    /* FRASE INSTITUCIONAL PROFISSIONAL REQUISITADA */
    .tagline { 
      font-size: clamp(0.88rem, 2vw, 0.95rem); 
      line-height: 1.65; 
      color: var(--text-secondary); 
      margin-top: 20px; 
      max-width: 820px;
      font-weight: 400;
      border-left: 3px solid var(--glow-primary);
      padding-left: 18px;
    }
    .tagline strong { color: #ffffff; font-weight: 600; }
    
    /* NAVEGAÇÃO EM GRID ADAPTATIVO */
    .main-tabs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
      margin-bottom: 32px;
    }
    .main-tab {
      background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.03); font-size: 0.85rem; font-weight: 600;
      padding: 14px 18px; border-radius: 6px; cursor: pointer; text-align: center;
      color: var(--text-secondary); transition: all 0.25s ease;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .main-tab:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
    .main-tab.active {
      background: rgba(10, 20, 38, 0.8);
      color: var(--text-primary); border-color: var(--glow-primary);
      box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.15);
    }
    
    /* COMPONENTE CENTRAL DE VIDRO COGNITIVO */
    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
      border-radius: 8px; border: 1px solid var(--border-glow); padding: clamp(20px, 5vw, 36px);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
    }

    /* PROVIMENTO E ESTRUTURA DO BUSCADOR */
    .search-area { display: flex; gap: 12px; margin-bottom: 32px; width: 100%; }
    .search-input { flex: 1; padding: 16px 24px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.6); color: #fff; font-size: 1rem; transition: all 0.3s; min-width: 0; }
    .search-input:focus { border-color: var(--glow-primary); outline: none; box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }
    .search-btn { background: #ffffff; border: none; padding: 16px 36px; border-radius: 6px; font-weight: 700; color: #03050a; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; white-space: nowrap; }
    .search-btn:hover { background: var(--glow-primary); box-shadow: 0 0 25px rgba(0, 212, 255, 0.3); }

    /* GRID PROFISSIONAL DE ITENS (PERFORMANCE VIRTUALIZADA) */
    .results-grid { display: flex; flex-direction: column; gap: 16px; max-height: 680px; overflow-y: auto; padding-right: 6px; }
    .virtual-row { content-visibility: auto; contain-intrinsic-size: 130px; }
    
    .result-card {
      background: rgba(255,255,255,0.01); border-radius: 6px; padding: 22px;
      border: 1px solid rgba(255,255,255,0.02); display: flex; gap: 20px; align-items: flex-start;
      transition: all 0.3s ease;
    }
    .result-card:hover { background: rgba(255,255,255,0.02); border-color: rgba(0, 212, 255, 0.2); }
    
    .checkbox { width: 20px; height: 20px; min-width: 20px; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.15); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: transparent; transition: all 0.2s; margin-top: 3px; }
    .checkbox.checked { background: var(--accent-neon); border-color: var(--accent-neon); color: #03050a; font-weight: 900; }
    
    .card-content { flex: 1; min-width: 0; }
    .card-title { font-size: 1.15rem; font-weight: 600; color: #ffffff; text-decoration: none; display: inline-block; margin-bottom: 6px; line-height: 1.4; }
    .card-title:hover { color: var(--glow-primary); }
    .card-meta { font-size: 0.75rem; color: var(--glow-primary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
    .card-abstract { font-size: 0.92rem; color: #a5b3cd; line-height: 1.65; text-align: justify; }
    
    .no-results { text-align: center; padding: 60px; color: var(--text-secondary); font-size: 0.95rem; }
    .footer { text-align: left; margin-top: 40px; font-size: 0.72rem; color: var(--text-secondary); opacity: 0.3; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 20px; text-transform: uppercase; letter-spacing: 2px;}
    
    .summary-section { margin-bottom: 40px; }
    .summary-title { font-size: 1rem; color: #ffffff; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; border-left: 2px solid var(--accent-neon); padding-left: 10px; }

    @media (max-width: 768px) {
      .search-area { flex-direction: column; gap: 10px; }
      .search-btn { width: 100%; text-align: center; }
      .result-card { gap: 14px; padding: 16px; }
      .main-tabs { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>

<div class="neural-network-bg"></div>

<div class="container">
  <header class="header" role="banner">
    <div class="logo-concept">
      <span class="logo-char">R</span>
      <span class="logo-char">E</span>
      <span class="logo-char">A</span>
      <span class="logo-char">D</span>
      <span class="logo-synapse">+</span>
    </div>
    <div class="tagline">O <strong>READ+</strong> integra repositórios globais para localizar artigos, livros, pesquisas e estudos científicos com acesso livre e gratuito em formato PDF, otimizando sua jornada de leitura e aprendizado contínuo.</div>
  </header>

  <nav class="main-tabs" role="tablist">
    <button class="main-tab active" data-main="articles" role="tab" id="tab-articles">Artigos</button>
    <button class="main-tab" data-main="books" role="tab" id="tab-books">Livros</button>
    <button class="main-tab" data-main="research" role="tab" id="tab-research">Pesquisas</button>
    <button class="main-tab" data-main="summary" role="tab" id="tab-summary">Resumo</button>
  </nav>

  <main class="glass-card" id="mainContent" role="main"></main>
  <footer class="footer" role="contentinfo">INTEGRATED COGNITIVE CORE // PERSISTENCE V12</footer>
</div>

<script src="js/main.js"></script>
</body>
</html>
