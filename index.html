<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#14191c">
  <title>Read + · Buscador de Artigos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #2D7A6E;
      --accent-light: #3f9c8d;
      --accent-glow: rgba(45, 122, 110, 0.25);
      --card-bg: rgba(20, 25, 28, 0.7);
      --border-light: rgba(255,255,255,0.1);
      --text-primary: #FCF7F0;
      --text-secondary: #CBD5E1;
      --overlay: rgba(0,0,0,0.55);
      --input-bg: rgba(255,255,255,0.08);
      --checkbox-bg: rgba(255,255,255,0.1);
      --tab-active: var(--accent);
      --tab-inactive: rgba(255,255,255,0.2);
    }

    body.light {
      --card-bg: rgba(245, 248, 250, 0.85);
      --border-light: rgba(0, 0, 0, 0.08);
      --text-primary: #1e2a2e;
      --text-secondary: #2c3e3e;
      --overlay: rgba(255,255,255,0.4);
      --input-bg: rgba(0,0,0,0.04);
      --checkbox-bg: rgba(0,0,0,0.05);
      --tab-inactive: rgba(0,0,0,0.1);
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      transition: background 0.3s, color 0.2s;
      padding: 20px 16px;
    }
    body.light {
      background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
    }

    .overlay-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--overlay);
      z-index: -1;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* cabeçalho */
    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.7rem;
      background: linear-gradient(135deg, #F5E7D3 0%, var(--accent) 100%);
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .header p {
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* botão tema */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-light);
      border-radius: 60px;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      cursor: pointer;
      z-index: 100;
      font-size: 1rem;
    }

    /* card principal */
    .search-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid var(--border-light);
      padding: 28px 32px;
      transition: all 0.3s;
    }

    /* pesquisa */
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    #queryInput {
      flex: 1;
      padding: 16px 22px;
      border-radius: 60px;
      border: 1px solid var(--border-light);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    #queryInput:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #searchBtn {
      background: var(--accent);
      border: none;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #searchBtn:hover {
      background: var(--accent-light);
      transform: scale(1.02);
    }

    /* abas */
    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 24px;
      padding-bottom: 8px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 8px 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
      border-radius: 40px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--tab-active);
      color: white;
    }
    .tab-btn:not(.active):hover {
      background: var(--tab-inactive);
      color: var(--text-primary);
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* estatísticas */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 48px;
      padding: 8px 16px;
    }
    .counter-circle {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-ring {
      width: 44px;
      height: 44px;
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      stroke: var(--accent);
      fill: none;
      stroke-width: 4;
    }
    .counter-text {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
    }
    .action-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* lista de artigos */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 550px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .article-card {
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      border-radius: 24px;
      padding: 18px;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .article-card:hover {
      background: rgba(0,0,0,0.4);
      transform: translateX(4px);
    }
    .checkbox-wrapper {
      flex-shrink: 0;
      margin-top: 4px;
    }
    .custom-checkbox {
      width: 26px;
      height: 26px;
      background: var(--checkbox-bg);
      border: 2px solid var(--accent);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
      font-weight: bold;
      color: white;
    }
    .custom-checkbox.checked {
      background: var(--accent);
    }
    .article-content {
      flex: 1;
    }
    .article-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }
    .article-title:hover {
      text-decoration: underline;
    }
    .article-authors {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .article-abstract {
      font-size: 0.85rem;
      color: var(--text-primary);
      margin: 8px 0;
      opacity: 0.9;
      line-height: 1.4;
    }
    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(45,122,110,0.85);
      padding: 5px 12px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      color: white;
      transition: background 0.2s;
    }
    .btn-pdf:hover {
      background: var(--accent);
    }
    .no-results, .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    /* scroll */
    .article-list::-webkit-scrollbar { width: 6px; }
    .article-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .article-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

    @media (max-width: 640px) {
      .search-card { padding: 18px; }
      .input-group { flex-direction: column; }
      #searchBtn { width: 100%; justify-content: center; }
      .article-card { flex-direction: column; }
      .stats-bar { flex-direction: column; align-items: stretch; }
      .tabs { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="overlay-bg"></div>
<div class="theme-toggle" id="themeToggle">
  <span>🌙</span> <span>☀️</span>
</div>
<div class="container">
  <div class="header">
    <h1>📚 Read +</h1>
    <p>Descubra artigos acadêmicos gratuitos · salve seus lidos</p>
  </div>
  <div class="search-card">
    <div class="input-group">
      <input type="text" id="queryInput" placeholder="Ex: machine learning in healthcare, climate change, theology..." autocomplete="off">
      <button id="searchBtn">🔍 Pesquisar</button>
    </div>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="search">📄 Artigos encontrados</button>
      <button class="tab-btn" data-tab="read">✅ Meus lidos</button>
    </div>

    <!-- Conteúdo da aba de busca -->
    <div id="searchTab" class="tab-content active">
      <div id="resultsArea" style="display: none;">
        <div class="stats-bar">
          <div class="counter-circle">
            <svg class="progress-ring" width="44" height="44">
              <circle class="progress-ring-circle" cx="22" cy="22" r="18" stroke-width="3" fill="none" stroke="currentColor" stroke-dasharray="113.1" stroke-dashoffset="0"></circle>
            </svg>
            <span id="counterText" class="counter-text">0 / 0 lidos</span>
          </div>
          <div class="action-buttons">
            <button id="markAllBtn" class="action-btn">✅ Marcar todos</button>
            <button id="clearAllBtn" class="action-btn">🗑️ Limpar leituras</button>
          </div>
        </div>
        <div id="articleList" class="article-list"></div>
      </div>
      <div id="noResultsMsg" style="display: none;" class="no-results">🔎 Nenhum artigo encontrado. Tente outro termo.</div>
    </div>

    <!-- Conteúdo da aba de lidos -->
    <div id="readTab" class="tab-content">
      <div id="readList" class="article-list">
        <div class="no-results">Nenhum artigo lido ainda. Marque ✓ nos artigos da aba "Artigos encontrados".</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <span>🔎 Fontes: OpenAlex (aberto) + arXiv · Leituras salvas no navegador</span>
  </div>
</div>

<script>
  // ====================== BUSCA COM OPENALEX + ARXIV ======================
  const queryInput = document.getElementById('queryInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultsArea = document.getElementById('resultsArea');
  const articleListDiv = document.getElementById('articleList');
  const noResultsMsg = document.getElementById('noResultsMsg');
  const readListDiv = document.getElementById('readList');
  const counterTextSpan = document.getElementById('counterText');
  const progressCircle = document.querySelector('.progress-ring-circle');
  const markAllBtn = document.getElementById('markAllBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');

  // Armazenamento dos artigos lidos (persistente)
  let readArticles = new Set();      // armazena ids dos artigos
  let currentArticles = [];         // artigos da última busca (cada um com id único)

  // Carregar salvos
  function loadReadStatus() {
    const stored = localStorage.getItem('readplus_read');
    if (stored) readArticles = new Set(JSON.parse(stored));
  }
  function saveReadStatus() {
    localStorage.setItem('readplus_read', JSON.stringify([...readArticles]));
  }

  // Atualizar contador e anel de progresso (apenas para a aba de busca)
  function updateCounter() {
    const total = currentArticles.length;
    let readCount = 0;
    currentArticles.forEach(art => { if (readArticles.has(art.id)) readCount++; });
    counterTextSpan.innerText = `${readCount} / ${total} lidos`;
    const percent = total === 0 ? 0 : readCount / total;
    const circumference = 113.1;
    progressCircle.style.strokeDashoffset = circumference * (1 - percent);
  }

  // Renderizar artigos na aba de busca
  function renderArticles(articles) {
    currentArticles = articles;
    if (!articles.length) {
      resultsArea.style.display = 'none';
      noResultsMsg.style.display = 'block';
      updateCounter();
      return;
    }
    resultsArea.style.display = 'block';
    noResultsMsg.style.display = 'none';
    articleListDiv.innerHTML = articles.map(art => {
      const checked = readArticles.has(art.id);
      return `
        <div class="article-card" data-id="${art.id}">
          <div class="checkbox-wrapper">
            <div class="custom-checkbox ${checked ? 'checked' : ''}" data-id="${art.id}">${checked ? '✓' : ''}</div>
          </div>
          <div class="article-content">
            <div>
              <a href="${art.pdfUrl || '#'}" target="_blank" class="article-title" style="${!art.pdfUrl ? 'opacity:0.6; cursor:default;' : ''}">
                📄 ${escapeHtml(art.title)}
              </a>
              <div class="article-authors">${art.authors.slice(0, 3).join(', ') || 'Autor(es) não informado'} ${art.authors.length > 3 ? '…' : ''}</div>
              <div class="article-abstract">${escapeHtml(art.abstract.substring(0, 280))}${art.abstract.length > 280 ? '…' : ''}</div>
              <div style="margin-top: 8px;">
                ${art.pdfUrl ? `<a href="${art.pdfUrl}" target="_blank" class="btn-pdf">📖 Ler PDF</a>` : '<span style="font-size:0.7rem;">📄 PDF não disponível</span>'}
                <span style="font-size:0.65rem; background:rgba(0,0,0,0.3); padding:2px 8px; border-radius:20px; margin-left:8px;">${art.source}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // adicionar eventos nos checkboxes
    document.querySelectorAll('.custom-checkbox').forEach(cb => {
      cb.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = cb.getAttribute('data-id');
        if (readArticles.has(id)) {
          readArticles.delete(id);
          cb.classList.remove('checked');
          cb.innerText = '';
        } else {
          readArticles.add(id);
          cb.classList.add('checked');
          cb.innerText = '✓';
        }
        saveReadStatus();
        updateCounter();
        renderReadTab();    // atualiza aba de lidos
      });
    });
    updateCounter();
  }

  // Renderizar aba "Meus lidos"
  function renderReadTab() {
    const readIds = [...readArticles];
    const readItems = currentArticles.filter(art => readIds.includes(art.id));
    if (!readItems.length) {
      readListDiv.innerHTML = `<div class="no-results">📭 Nenhum artigo lido ainda. Marque ✓ nos artigos da aba "Artigos encontrados".</div>`;
      return;
    }
    readListDiv.innerHTML = readItems.map(art => `
      <div class="article-card">
        <div class="article-content">
          <a href="${art.pdfUrl || '#'}" target="_blank" class="article-title">📄 ${escapeHtml(art.title)}</a>
          <div class="article-authors">${art.authors.slice(0, 3).join(', ') || 'Autor(es) não informado'}</div>
          <div class="article-abstract">${escapeHtml(art.abstract.substring(0, 200))}…</div>
          <div style="margin-top: 8px;">
            ${art.pdfUrl ? `<a href="${art.pdfUrl}" target="_blank" class="btn-pdf">📖 Ler PDF</a>` : ''}
            <button class="action-btn unread-btn" data-id="${art.id}" style="margin-left:8px;">🗑️ Remover dos lidos</button>
          </div>
        </div>
      </div>
    `).join('');
    // eventos para remover da lista de lidos
    document.querySelectorAll('.unread-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        readArticles.delete(id);
        saveReadStatus();
        renderReadTab();
        // se a aba de busca estiver ativa, atualizar checkboxes
        if (document.querySelector('.tab-btn.active').getAttribute('data-tab') === 'search') {
          // re-renderizar a busca (mantém artigos)
          renderArticles(currentArticles);
        } else {
          updateCounter();
        }
      });
    });
  }

  // Funções de busca
  async function searchOpenAlex(query) {
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=open_access.is_oa:true&sort=relevance_score:desc&per-page=12`;
    try {
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return data.results.map(work => ({
        title: work.title || 'Sem título',
        authors: work.authorships?.map(a => a.author.display_name) || [],
        abstract: work.abstract || 'Resumo não disponível.',
        pdfUrl: work.open_access?.oa_url || work.best_oa_location?.pdf_url || null,
        source: 'OpenAlex'
      }));
    } catch (e) { console.warn(e); return []; }
  }

  async function searchArXiv(query) {
    const url = `https://export.arxiv.org/api/query?search_query=all:${encodeURIComponent(query)}&max_results=8`;
    try {
      const res = await fetch(url);
      const text = await res.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, 'text/xml');
      const entries = xml.querySelectorAll('entry');
      const results = [];
      entries.forEach(entry => {
        let pdfUrl = '';
        const links = entry.querySelectorAll('link');
        links.forEach(link => {
          if (link.getAttribute('title') === 'pdf' || link.getAttribute('type') === 'application/pdf')
            pdfUrl = link.getAttribute('href');
        });
        if (!pdfUrl) {
          const id = entry.querySelector('id')?.textContent;
          if (id) pdfUrl = id.replace('abs', 'pdf') + '.pdf';
        }
        results.push({
          title: entry.querySelector('title')?.textContent?.trim() || 'Sem título',
          authors: Array.from(entry.querySelectorAll('author name')).map(el => el.textContent),
          abstract: entry.querySelector('summary')?.textContent?.trim()?.substring(0, 500) || '',
          pdfUrl,
          source: 'arXiv'
        });
      });
      return results;
    } catch (e) { return []; }
  }

  async function performSearch() {
    const query = queryInput.value.trim();
    if (!query) return;
    articleListDiv.innerHTML = `<div class="loading">🔍 Buscando em OpenAlex e arXiv... Aguarde.</div>`;
    resultsArea.style.display = 'block';
    noResultsMsg.style.display = 'none';
    const [openAlex, arxiv] = await Promise.all([searchOpenAlex(query), searchArXiv(query)]);
    let all = [...openAlex, ...arxiv];
    // remover duplicatas (título)
    const unique = [];
    const titles = new Set();
    for (const art of all) {
      if (!titles.has(art.title.toLowerCase())) {
        titles.add(art.title.toLowerCase());
        unique.push(art);
      }
    }
    const articlesWithId = unique.slice(0, 18).map((art, idx) => ({
      ...art,
      id: btoa(art.title + art.source + idx).replace(/[^a-zA-Z0-9]/g, '')
    }));
    renderArticles(articlesWithId);
    renderReadTab(); // atualiza a aba lidos (caso tenha algo marcado)
  }

  // Controle de abas
  function initTabs() {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        if (tabId === 'search') {
          document.getElementById('searchTab').classList.add('active');
          if (currentArticles.length) renderArticles(currentArticles); // re-renderiza para sincronizar checkboxes
        } else {
          document.getElementById('readTab').classList.add('active');
          renderReadTab();
        }
      });
    });
  }

  // Ações em massa
  markAllBtn.addEventListener('click', () => {
    currentArticles.forEach(art => readArticles.add(art.id));
    saveReadStatus();
    renderArticles(currentArticles);
    renderReadTab();
  });
  clearAllBtn.addEventListener('click', () => {
    currentArticles.forEach(art => readArticles.delete(art.id));
    saveReadStatus();
    renderArticles(currentArticles);
    renderReadTab();
  });

  // Tema claro/escuro
  const themeToggle = document.getElementById('themeToggle');
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
  });

  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  loadReadStatus();
  initTabs();
  searchBtn.addEventListener('click', performSearch);
  queryInput.addEventListener('keypress', (e) => e.key === 'Enter' && performSearch());
</script>
</body>
</html>
