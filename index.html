<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="Read+ · Segundo Cérebro | Zettelkasten · Revisão espaçada · Backlinks · Knowledge Graph">
  <title>Read+ · Segundo Cérebro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #05070f;
      --bg-card: rgba(12, 18, 28, 0.65);
      --glow-primary: #00d4ff;
      --glow-secondary: #7b2cbf;
      --accent: #00d4ff;
      --text-primary: #f0f3fa;
      --text-secondary: #9aa4bf;
      --border-light: rgba(0, 212, 255, 0.2);
      --shadow-neon: 0 0 12px rgba(0,212,255,0.3);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0a0f1c, #02040c);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: linear-gradient(var(--border-light) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: 0.2;
      z-index: 0;
    }
    .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
    .header { text-align: center; margin-bottom: 40px; }
    .logo {
      font-size: 3.8rem; font-weight: 800; letter-spacing: -2px;
      background: linear-gradient(135deg, #fff, var(--glow-primary), var(--glow-secondary));
      background-clip: text; color: transparent;
      text-shadow: 0 0 20px rgba(0,212,255,0.4);
      display: inline-block;
      animation: flicker 3s infinite;
    }
    @keyframes flicker { 0%,100%{opacity:1;text-shadow:0 0 20px rgba(0,212,255,0.4);} 50%{opacity:0.95;text-shadow:0 0 30px rgba(0,212,255,0.8);} }
    .logo span { font-size: 1rem; vertical-align: super; color: var(--glow-primary); }
    .tagline { color: var(--text-secondary); margin-top: 8px; letter-spacing: 1px; }
    .main-tabs {
      display: flex; justify-content: center; gap: 20px; margin-bottom: 28px;
      border-bottom: 1px solid var(--border-light); padding-bottom: 8px; flex-wrap: wrap;
    }
    .main-tab {
      background: none; border: none; font-size: 1.2rem; font-weight: 600;
      padding: 12px 28px; border-radius: 60px; cursor: pointer;
      color: var(--text-secondary); transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .main-tab.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,44,191,0.2));
      color: var(--glow-primary); box-shadow: var(--shadow-neon); border: 1px solid var(--glow-primary);
    }
    .main-tab:hover:not(.active) { color: white; background: rgba(0,212,255,0.1); }
    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(16px); border-radius: 2rem;
      border: 1px solid var(--border-light); padding: 28px 32px; transition: all 0.3s;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
    }
    .sub-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; flex-wrap: wrap; }
    .sub-tab {
      background: none; border: none; padding: 6px 18px; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; border-radius: 40px; color: var(--text-secondary); transition: 0.2s;
    }
    .sub-tab.active { background: var(--glow-primary); color: #02040c; box-shadow: 0 0 10px var(--glow-primary); }
    .sub-content { display: none; animation: fadeIn 0.25s ease; }
    .sub-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .search-area { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .search-input {
      flex: 1; padding: 14px 22px; border-radius: 60px; border: 1px solid var(--border-light);
      background: rgba(0,0,0,0.4); color: white; font-size: 1rem; font-family: 'Inter', sans-serif;
    }
    .search-input:focus { outline: none; border-color: var(--glow-primary); box-shadow: 0 0 0 3px rgba(0,212,255,0.3); }
    .search-btn {
      background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary));
      border: none; padding: 12px 32px; border-radius: 60px; font-weight: 700; color: white; cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }
    .search-btn:hover { transform: scale(1.02); filter: brightness(1.05); }
    .results-grid { display: flex; flex-direction: column; gap: 16px; max-height: 550px; overflow-y: auto; padding-right: 6px; }
    .result-card {
      background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); border-radius: 24px; padding: 18px;
      transition: all 0.2s; border: 1px solid rgba(0,212,255,0.2); display: flex; gap: 16px; align-items: flex-start;
      margin-bottom: 12px;
    }
    .result-card:hover { transform: translateX(6px); border-color: var(--glow-primary); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
    .checkbox {
      width: 24px; height: 24px; background: rgba(255,255,255,0.1); border: 2px solid var(--glow-primary);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
    }
    .checkbox.checked { background: var(--glow-primary); color: black; }
    .status-select {
      background: rgba(0,0,0,0.6); border: 1px solid var(--glow-primary); border-radius: 20px;
      padding: 4px 8px; font-size: 0.7rem; color: white; cursor: pointer;
    }
    .card-content { flex: 1; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--glow-primary); text-decoration: none; display: inline-block; margin-bottom: 6px; }
    .card-meta { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; }
    .card-abstract { font-size: 0.85rem; margin: 8px 0; opacity: 0.9; line-height: 1.4; }
    .btn-link, .action-btn {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(0,212,255,0.2);
      padding: 5px 12px; border-radius: 40px; text-decoration: none; font-size: 0.7rem; font-weight: 500;
      color: white; transition: 0.2s; border: none; cursor: pointer;
    }
    .btn-link:hover, .action-btn:hover { background: var(--glow-primary); color: #02040c; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .dashboard-card { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border-radius: 28px; padding: 20px; border: 1px solid var(--border-light); }
    .cy-container { height: 550px; width: 100%; background: rgba(0,0,0,0.3); border-radius: 24px; margin-top: 20px; }
    .badge { background: linear-gradient(135deg, #00d4ff, #7b2cbf); border-radius: 40px; padding: 4px 12px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
    .inline-edit { background: rgba(0,0,0,0.5); border: 1px solid var(--glow-primary); border-radius: 12px; padding: 12px; width: 100%; color: white; margin-top: 8px; }
    .filter-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-group select, .filter-group input { background: rgba(0,0,0,0.6); border: 1px solid var(--glow-primary); padding: 8px 16px; border-radius: 40px; color: white; }
    .comparison-table { width: 100%; border-collapse: collapse; }
    .comparison-table th, .comparison-table td { border: 1px solid var(--border-light); padding: 12px; text-align: left; vertical-align: top; }
    .loader { text-align: center; padding: 40px; }
    .spinner { width: 50px; height: 50px; border: 3px solid rgba(0,212,255,0.3); border-top-color: var(--glow-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-results { text-align: center; padding: 40px; color: var(--text-secondary); }
    .footer { text-align: center; margin-top: 32px; font-size: 0.7rem; color: var(--text-secondary); }
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .heatmap-day { aspect-ratio: 1; border-radius: 6px; }
    .revision-btn-group { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .revision-btn { background: rgba(0,212,255,0.2); border: none; padding: 4px 12px; border-radius: 20px; color: white; cursor: pointer; }
    .backlink-badge { background: #00d4ff22; border: 1px solid var(--glow-primary); border-radius: 20px; padding: 2px 8px; font-size: 0.7rem; display: inline-block; margin: 2px; }
    @media (max-width: 700px) { .glass-card { padding: 18px; } .main-tab { padding: 8px 16px; font-size: 1rem; } .result-card { flex-direction: column; } .search-area { flex-direction: column; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Read <span>+</span></div>
    <div class="tagline">segundo cérebro · zettelkasten · revisão espaçada · graph inteligente</div>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" data-main="articles">📄 Artigos</button>
    <button class="main-tab" data-main="books">📚 Livros</button>
    <button class="main-tab" data-main="research">🔬 Pesquisas</button>
    <button class="main-tab" data-main="brain">🧠 Segundo Cérebro</button>
  </div>

  <div class="glass-card" id="mainContent"></div>
  <div class="footer">🔎 Fontes: OpenAlex · Google Books · IndexedDB · Backlinks · Revisão espaçada (SM-2) · PWA</div>
</div>

<script>
  // ========== 1. INDEXEDDB (v4) + DADOS GLOBAIS ==========
  let db = null;
  let migrationDone = false;

  // Dados principais
  let articlesData = [], booksData = [], researchData = [];
  let readArticles = new Set(), readBooks = new Set(), readResearch = new Set();
  let readingStatus = { articles: {}, books: {}, research: {} };
  let favorites = { articles: [], books: [], research: [] };
  let notes = {}, collections = [], tags = {}, userProfile = { name: "Pesquisador", xp: 0, level: 0, badges: [] };
  let goals = [], studyLog = [], radarTopics = [];
  let tagAliases = {};

  // Zettelkasten
  let zettels = [];
  let backlinksMap = new Map();

  // Revisão espaçada (SM-2)
  let repetitionData = new Map();

  // Cache de buscas
  let searchCache = new Map();

  function escapeHtml(str) { return str == null ? '' : String(str).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
  function sanitizeUrl(url) { return (!url || !url.startsWith('http')) ? '#' : url; }
  function stableHash(str) { let h = 0; for (let i=0;i<str.length;i++) h = ((h<<5)-h)+str.charCodeAt(i)|0; return Math.abs(h).toString(36); }
  function normalizeTag(t) { let low = t.toLowerCase(); return tagAliases[low] || low; }
  function addAlias(canon, ...als) { als.forEach(a=>tagAliases[a.toLowerCase()]=canon); }
  addAlias('ia','inteligencia artificial','ai','machine learning','deep learning');
  addAlias('filosofia','philosophy','estoicismo','epicuro');
  addAlias('psicologia','psychology','cognitivo');

  async function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('ReadPlusDB', 4);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        const stores = ['articles', 'books', 'research', 'notes', 'collections', 'tags', 'favorites', 'reading_status', 'study_log', 'radar', 'settings', 'cache', 'zettels', 'backlinks', 'spaced_repetition'];
        for (let store of stores) {
          if (!db.objectStoreNames.contains(store)) db.createObjectStore(store, { keyPath: store === 'settings' || store === 'cache' ? 'key' : 'id' });
        }
      };
      request.onsuccess = (event) => {
        db = event.target.result;
        migrateFromLocalStorage().then(resolve).catch(resolve);
      };
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function migrateFromLocalStorage() {
    if (migrationDone) return;
    migrationDone = true;
    const tx = db.transaction(['settings'], 'readonly');
    const existing = await new Promise(resolve => { tx.objectStore('settings').get('migrated').onsuccess = e => resolve(e.target.result); });
    if (existing && existing.value === true) return;
    // Migração dos dados antigos (se existirem)
    const map = {
      articles: 'readplus_metadata_articles', books: 'readplus_metadata_books', research: 'readplus_metadata_research',
      notes: 'readplus_notes', collections: 'readplus_collections', tags: 'readplus_tags', favorites: 'readplus_favorites',
      reading_status: 'readplus_reading_status', study_log: 'readplus_study_log', radar: 'readplus_radar_topics'
    };
    for (let [store, lsKey] of Object.entries(map)) {
      const data = localStorage.getItem(lsKey);
      if (data) {
        const parsed = JSON.parse(data);
        const tx2 = db.transaction([store], 'readwrite');
        const store2 = tx2.objectStore(store);
        if (Array.isArray(parsed)) parsed.forEach(item => store2.put(item));
        else store2.put(parsed);
      }
    }
    const txSet = db.transaction(['settings'], 'readwrite');
    txSet.objectStore('settings').put({ key: 'migrated', value: true });
    console.log('Migração concluída');
  }

  async function loadAllData() {
    const stores = ['articles', 'books', 'research', 'notes', 'collections', 'tags', 'favorites', 'reading_status', 'study_log', 'radar', 'settings', 'zettels', 'backlinks', 'spaced_repetition'];
    for (let store of stores) {
      const tx = db.transaction([store], 'readonly');
      const data = await new Promise(resolve => { tx.objectStore(store).getAll().onsuccess = e => resolve(e.target.result); });
      if (store === 'articles') articlesData = data;
      else if (store === 'books') booksData = data;
      else if (store === 'research') researchData = data;
      else if (store === 'notes') notes = data.reduce((acc,n)=>{acc[n.id]=n; return acc;},{});
      else if (store === 'collections') collections = data;
      else if (store === 'tags') data.forEach(t=>tags[t.id]=t.items);
      else if (store === 'favorites') {
        favorites = { articles: data.filter(f=>f.type==='article'), books: data.filter(f=>f.type==='book'), research: data.filter(f=>f.type==='research') };
      }
      else if (store === 'reading_status') data.forEach(s=>{ if(!readingStatus[s.type]) readingStatus[s.type]={}; readingStatus[s.type][s.id]=s.status; });
      else if (store === 'study_log') studyLog = data;
      else if (store === 'radar') radarTopics = data.map(r=>r.topic);
      else if (store === 'settings') {
        let prof = data.find(s=>s.key==='profile');
        if (prof) userProfile = prof.value;
      }
      else if (store === 'zettels') zettels = data;
      else if (store === 'backlinks') data.forEach(b=>backlinksMap.set(b.id, b));
      else if (store === 'spaced_repetition') data.forEach(d=>repetitionData.set(d.id, d));
    }
  }

  async function saveToDB(storeName, item) {
    const tx = db.transaction([storeName], 'readwrite');
    tx.objectStore(storeName).put(item);
  }

  function addXP(amount) {
    userProfile.xp += amount;
    let newLevel = Math.min(4, Math.floor(userProfile.xp/100));
    if (newLevel > userProfile.level) {
      userProfile.level = newLevel;
      const lvls=['Explorador','Pesquisador','Analista','Especialista','Mestre'];
      if (!userProfile.badges.includes(lvls[newLevel])) userProfile.badges.push(lvls[newLevel]);
      showToast(`🎉 Nível ${lvls[newLevel]} alcançado!`);
    }
    saveToDB('settings', { key: 'profile', value: userProfile });
  }

  function showToast(msg) { const t=document.createElement('div'); t.innerText=msg; t.style.cssText='position:fixed;bottom:20px;right:20px;background:var(--glow-primary);color:#02040c;padding:12px 24px;border-radius:40px;z-index:9999'; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

  // ========== 2. APIs (OpenAlex + Google Books) com cache ==========
  async function setCache(key, data, ttl=3600000) {
    const tx = db.transaction(['cache'], 'readwrite');
    tx.objectStore('cache').put({ key, data, expires: Date.now()+ttl });
  }
  async function getCache(key) {
    const tx = db.transaction(['cache'], 'readonly');
    const res = await new Promise(resolve=>{ tx.objectStore('cache').get(key).onsuccess=e=>resolve(e.target.result); });
    if (res && res.expires > Date.now()) return res.data;
    return null;
  }

  async function searchOpenAlex(query, type='article', filters={}) {
    const cacheKey = `oa_${type}_${query}_${filters.year||''}_${filters.minCited||''}`;
    const cached = await getCache(cacheKey);
    if (cached) return cached;
    let filterParts = ['open_access.is_oa:true'];
    if (filters.year) filterParts.push(`publication_year:${filters.year}`);
    if (filters.minCited) filterParts.push(`cited_by_count:>${filters.minCited}`);
    if (type==='research') filterParts.push('type:article,type:report');
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=${filterParts.join(',')}&sort=relevance_score:desc&per-page=20`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    const results = data.results.map(w => ({
      id: stableHash(w.id || w.title),
      title: w.title || 'Sem título',
      authors: w.authorships?.map(a=>a.author.display_name)||[],
      abstract: w.abstract || (w.abstract_inverted_index ? Object.entries(w.abstract_inverted_index).sort((a,b)=>a[1][0]-b[1][0]).map(([w])=>w).join(' ') : 'Resumo não disponível.'),
      url: w.open_access?.oa_url || w.best_oa_location?.pdf_url || w.id,
      source: 'OpenAlex',
      doi: w.doi,
      citations: w.cited_by_count,
      publication_date: w.publication_date,
      institutions: w.authorships?.[0]?.institutions?.map(i=>i.display_name)||[],
      type: type==='article'?'article':'research'
    }));
    await setCache(cacheKey, results, 3600000);
    return results;
  }

  async function searchBooks(query) {
    const cacheKey = `gb_${query}`;
    const cached = await getCache(cacheKey);
    if (cached) return cached;
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=20`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.items) return [];
    const results = data.items.map(item => ({
      id: item.id,
      title: item.volumeInfo.title||'Sem título',
      authors: item.volumeInfo.authors||['Autor não informado'],
      abstract: item.volumeInfo.description||'Sinopse não disponível.',
      url: item.volumeInfo.previewLink||item.volumeInfo.infoLink,
      source: 'Google Books',
      publishedDate: item.volumeInfo.publishedDate,
      type: 'book'
    }));
    await setCache(cacheKey, results, 3600000);
    return results;
  }

  // ========== 3. Zettelkasten e Backlinks ==========
  async function saveZettel(z) { await saveToDB('zettels', z); await loadAllData(); }
  async function parseAndUpdateBacklinks(content, zettelId) {
    const regex = /\[\[(.*?)\]\]/g;
    let match; const links = [];
    while ((match = regex.exec(content)) !== null) links.push(match[1]);
    const tx = db.transaction(['backlinks'], 'readwrite');
    const store = tx.objectStore('backlinks');
    for (let target of links) {
      let entry = await new Promise(resolve=>{store.get(target).onsuccess=e=>resolve(e.target.result);});
      if (!entry) entry = { id: target, incoming: [], outgoing: [] };
      if (!entry.incoming.includes(zettelId)) entry.incoming.push(zettelId);
      if (!entry.outgoing.includes(zettelId)) entry.outgoing.push(zettelId);
      store.put(entry);
    }
  }

  // Revisão espaçada SM-2
  async function saveRepetition(cardId, ease, interval, nextReview, repetitions) {
    const card = { id: cardId, ease, interval, nextReview, repetitions };
    await saveToDB('spaced_repetition', card);
    repetitionData.set(cardId, card);
  }
  function updateSpacedRepetition(cardId, quality) {
    let card = repetitionData.get(cardId);
    if (!card) card = { ease: 2.5, interval: 0, repetitions: 0, nextReview: Date.now() };
    let { ease, interval, repetitions } = card;
    ease = Math.max(1.3, ease + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    if (quality >= 3) {
      if (repetitions === 0) interval = 1;
      else if (repetitions === 1) interval = 6;
      else interval = Math.round(interval * ease);
      repetitions++;
    } else {
      interval = 0;
      repetitions = 0;
    }
    const nextReview = Date.now() + interval * 86400000;
    saveRepetition(cardId, ease, interval, nextReview, repetitions);
    showToast(`Revisão registrada! Próxima revisão em ${interval} dias.`);
  }

  // ========== 4. FUNÇÕES DE RENDERIZAÇÃO (preservadas e adaptadas) ==========
  function renderSearchResults(containerId, items, type, readSet) {
    const container = document.getElementById(containerId);
    if (!items.length) { container.innerHTML = '<div class="no-results">Nenhum resultado encontrado</div>'; return; }
    container.innerHTML = items.map(item => {
      const isRead = readSet.has(item.id);
      const status = readingStatus[type]?.[item.id] || '';
      return `
        <div class="result-card">
          <div class="checkbox ${isRead ? 'checked' : ''}" data-id="${item.id}" data-type="${type}">${isRead ? '✓' : ''}</div>
          <div class="card-content">
            <a href="${sanitizeUrl(item.url)}" target="_blank" class="card-title">📄 ${escapeHtml(item.title)}</a>
            <div class="card-meta">${escapeHtml(item.authors.slice(0,3).join(', '))} · ${item.source}</div>
            <div class="card-abstract">${escapeHtml(item.abstract?.substring(0,280)||'')}…</div>
            <div>
              <select class="status-select" data-id="${item.id}" data-type="${type}" data-original="${status}">
                <option value="">Sem status</option><option value="want" ${status==='want'?'selected':''}>📌 Quero ler</option>
                <option value="reading" ${status==='reading'?'selected':''}>📖 Lendo</option>
                <option value="reviewing" ${status==='reviewing'?'selected':''}>🔄 Revisando</option>
                <option value="done" ${status==='done'?'selected':''}>✅ Concluído</option>
              </select>
              <button class="action-btn fav-btn" data-id="${item.id}" data-type="${type}" data-title="${escapeHtml(item.title)}" data-url="${sanitizeUrl(item.url)}">${favorites[type]?.some(f=>f.id===item.id)?'❤️ Favoritado':'🤍 Favoritar'}</button>
              <button class="action-btn note-btn" data-id="${item.id}">📝 Nota</button>
              <button class="action-btn tag-btn" data-id="${item.id}" data-type="${type}">🏷️ Tag</button>
              <button class="action-btn zettel-btn" data-id="${item.id}" data-title="${escapeHtml(item.title)}" data-type="${type}">🧠 Criar Zettel</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    // Eventos (usando delegação para evitar duplicação)
    container.querySelectorAll('.checkbox').forEach(cb => cb.addEventListener('click', async (e) => {
      const id = cb.dataset.id, t = cb.dataset.type;
      if (t === 'article') readArticles.has(id) ? readArticles.delete(id) : (readArticles.add(id), addXP(10));
      else if (t === 'book') readBooks.has(id) ? readBooks.delete(id) : (readBooks.add(id), addXP(10));
      else readResearch.has(id) ? readResearch.delete(id) : (readResearch.add(id), addXP(10));
      await saveToDB(t+'s', { id }); // simplificado
      renderSearchResults(containerId, items, type, readSet);
    }));
    container.querySelectorAll('.status-select').forEach(sel => sel.addEventListener('change', async (e) => {
      const id = sel.dataset.id, t = sel.dataset.type, val = sel.value;
      if (!readingStatus[t]) readingStatus[t] = {};
      readingStatus[t][id] = val;
      await saveToDB('reading_status', { id, type: t, status: val });
      renderSearchResults(containerId, items, type, readSet);
    }));
    container.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id, t = btn.dataset.type, item = items.find(i=>i.id===id);
      if (item) {
        const idx = favorites[t].findIndex(f=>f.id===id);
        idx === -1 ? favorites[t].push({ id, title: item.title, type: t, url: item.url, date: new Date().toISOString() }) : favorites[t].splice(idx,1);
        await saveToDB('favorites', favorites[t]);
        renderSearchResults(containerId, items, type, readSet);
      }
    }));
    container.querySelectorAll('.note-btn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id, txt = prompt('Nota pessoal:');
      if (txt) { notes[id] = { ...notes[id], comment: txt }; await saveToDB('notes', { id, comment: txt }); addXP(5); showToast('Nota salva!'); }
    }));
    container.querySelectorAll('.tag-btn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id, t = btn.dataset.type, tag = prompt('Tag:');
      if (tag) {
        const norm = normalizeTag(tag);
        if (!tags[norm]) tags[norm] = [];
        if (!tags[norm].includes(id)) tags[norm].push(id);
        await saveToDB('tags', { id: norm, items: tags[norm] });
        addXP(2);
      }
    }));
    container.querySelectorAll('.zettel-btn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id, title = btn.dataset.title, type = btn.dataset.type;
      const newZettel = {
        id: stableHash(title+Date.now()), title, content: `Referência a ${type}: [[${id}]]\n\nNotas iniciais:`, type: 'literature',
        created: Date.now(), updated: Date.now(), tags: [], links: [id]
      };
      await saveZettel(newZettel);
      showToast('Zettel criado! Vá em Segundo Cérebro → Zettelkasten.');
    }));
  }

  // Abas principais (roteamento)
  let currentMainTab = 'articles';

      <div id="articlesReadSub" class="sub-content"><div id="readArticlesList"></div></div>`;

  // ========== 5. SEGUNDO CÉREBRO (aba principal) – TUDO INTEGRADO ==========
  async function renderBrainTab() {
    const html = `
      <div class="sub-tabs">
        <button class="sub-tab active" data-sub="zettel">📔 Zettelkasten</button>
        <button class="sub-tab" data-sub="backlinks">🔗 Backlinks</button>
        <button class="sub-tab" data-sub="spaced">🔄 Revisão Espaçada</button>
        <button class="sub-tab" data-sub="graph">🗺️ Knowledge Graph</button>
        <button class="sub-tab" data-sub="dashboard">📊 Dashboard Executivo</button>
        <button class="sub-tab" data-sub="radar">📡 Radar Científico</button>
        <button class="sub-tab" data-sub="compare">⚖️ Comparador</button>
        <button class="sub-tab" data-sub="export">💾 Exportar</button>
      </div>
      <div id="brainZettel" class="sub-content active"><div id="zettelList"></div><button id="newZettelBtn" class="search-btn">➕ Nova Nota Atômica</button></div>
      <div id="brainBacklinks" class="sub-content"><div id="backlinksList"></div></div>
      <div id="brainSpaced" class="sub-content"><div id="spacedList"></div></div>
      <div id="brainGraph" class="sub-content"><div id="cy" class="cy-container"></div></div>
      <div id="brainDashboard" class="sub-content"><div id="execDashboard"></div></div>
      <div id="brainRadar" class="sub-content"><div id="radarPanel"></div></div>
      <div id="brainCompare" class="sub-content"><div id="comparePanel"></div></div>

    `;
    document.getElementById('mainContent').innerHTML = html;
    // Carregar Zettels
    await loadAllData();
    renderZettelList();
    renderBacklinks();
    renderSpacedRepetition();
    renderKnowledgeGraph();
    renderExecDashboard();
    renderRadarProfessional();
    renderComparePanel();
    renderExportPanel();
    document.getElementById('newZettelBtn').onclick = () => {
      const title = prompt('Título da nota (atômica):');
      if (title) {
        const newZ = { id: stableHash(title+Date.now()), title, content: '', type: 'fleeting', created: Date.now(), updated: Date.now(), tags: [], links: [] };
        saveZettel(newZ);
        renderZettelList();
      }
    };
  }

  async function renderZettelList() {
    const container = document.getElementById('zettelList');
    if (!zettels.length) { container.innerHTML = '<div class="no-results">Nenhuma nota criada. Crie sua primeira nota atômica.</div>'; return; }
    container.innerHTML = zettels.map(z => `
      <div class="result-card">
        <div class="card-content">
          <div class="card-title">📄 ${escapeHtml(z.title)} (${z.type || 'fleeting'})</div>
          <textarea id="zettel-${z.id}" class="inline-edit" placeholder="Conteúdo da nota (use [[links]])">${escapeHtml(z.content)}</textarea>
          <div><input id="tags-${z.id}" placeholder="Tags separadas por vírgula" value="${(z.tags||[]).join(', ')}" class="search-input" style="margin-top:8px;"></div>
          <button class="action-btn save-zettel" data-id="${z.id}">💾 Salvar</button>
          <button class="action-btn delete-zettel" data-id="${z.id}">🗑️ Excluir</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.save-zettel').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const z = zettels.find(z=>z.id===id);
      if (z) {
        z.content = document.getElementById(`zettel-${id}`).value;
        z.tags = document.getElementById(`tags-${id}`).value.split(',').map(s=>s.trim()).filter(Boolean);
        z.updated = Date.now();
        await saveZettel(z);
        await parseAndUpdateBacklinks(z.content, id);
        renderZettelList(); renderBacklinks(); renderKnowledgeGraph();
        showToast('Zettel salvo e backlinks atualizados!');
      }
    }));
    document.querySelectorAll('.delete-zettel').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      zettels = zettels.filter(z=>z.id!==id);
      await saveToDB('zettels', { id }); // delete
      renderZettelList(); renderBacklinks(); renderKnowledgeGraph();
    }));
  }

  async function renderBacklinks() {
    const container = document.getElementById('backlinksList');
    if (backlinksMap.size === 0) { container.innerHTML = '<div class="no-results">Nenhum backlink ainda. Crie notas com [[links]] e eles aparecerão aqui.</div>'; return; }
    let html = '';
    for (let [target, data] of backlinksMap.entries()) {
      html += `<div class="result-card"><strong>🔗 [[${escapeHtml(target)}]]</strong> — ${data.incoming.length} referências recebidas<ul>${data.incoming.map(inc=>`<li>${escapeHtml(zettels.find(z=>z.id===inc)?.title || inc)}</li>`).join('')}</ul></div>`;
    }
    container.innerHTML = html;
  }

  async function renderSpacedRepetition() {
    const now = Date.now();
    const due = Array.from(repetitionData.values()).filter(c => c.nextReview <= now);
    const container = document.getElementById('spacedList');
    if (!due.length) { container.innerHTML = '<div class="no-results">Nenhuma revisão pendente. Continue estudando!</div>'; return; }
    container.innerHTML = due.map(c => {
      const z = zettels.find(z=>z.id===c.id);
      return `<div class="result-card"><div class="card-title">${escapeHtml(z?.title || c.id)}</div><div class="revision-btn-group"><button class="revision-btn" data-id="${c.id}" data-quality="1">❌ Esqueci</button><button class="revision-btn" data-id="${c.id}" data-quality="2">⚠️ Difícil</button><button class="revision-btn" data-id="${c.id}" data-quality="3">👍 Bom</button><button class="revision-btn" data-id="${c.id}" data-quality="4">🌟 Fácil</button></div></div>`;
    }).join('');
    document.querySelectorAll('.revision-btn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id, quality = parseInt(btn.dataset.quality);
      updateSpacedRepetition(id, quality);
      renderSpacedRepetition();
    }));
  }

  async function renderKnowledgeGraph() {
    const cyContainer = document.getElementById('cy');
    if (!cyContainer) return;
    const elements = [];
    // Adicionar nós: zettels e tags
    zettels.forEach(z => { elements.push({ data: { id: z.id, label: z.title.substring(0,20) }, classes: 'zettel' }); });
    const allTags = new Set();
    zettels.forEach(z => (z.tags||[]).forEach(t=>allTags.add(t)));
    allTags.forEach(t => elements.push({ data: { id: t, label: t }, classes: 'tag' }));
    // Arestas: backlinks
    for (let [target, data] of backlinksMap.entries()) {
      data.incoming.forEach(src => elements.push({ data: { source: src, target, weight: 1 } }));
    }
    // Arestas de tags
    zettels.forEach(z => (z.tags||[]).forEach(tag => elements.push({ data: { source: z.id, target: tag, weight: 0.5 } })));
    if (window.cyInstance) window.cyInstance.destroy();
    window.cyInstance = cytoscape({ container: cyContainer, elements, style: [{ selector: 'node', style: { 'background-color': '#00d4ff', label: 'data(label)', color: 'white' } }, { selector: '.tag', style: { 'background-color': '#7b2cbf' } }], layout: { name: 'cose', animate: true } });
  }

  async function renderExecDashboard() {
    const totalRead = readArticles.size+readBooks.size+readResearch.size;
    const monthly = studyLog.filter(l=>new Date(l.date)>new Date(Date.now()-30*86400000)).length;
    const streak = (()=>{let s=0,dates=[...new Set(studyLog.map(l=>l.date))].sort().reverse(),last=new Date().toLocaleDateString('en-CA');for(let d of dates){if(d===last){s++;last=new Date(Date.parse(last)-86400000).toLocaleDateString('en-CA');}else break;}return s;})();
    const topTags = Object.entries(tags).map(([t,ids])=>[t,ids.length]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    document.getElementById('execDashboard').innerHTML = `
      <div class="dashboard-grid">
        <div class="dashboard-card"><h3>📊 Resumo</h3><p>Total lidos: ${totalRead}</p><p>Leituras mês: ${monthly}</p><p>Sequência: ${streak} dias</p><p>XP: ${userProfile.xp} | Nível: ${userProfile.level}</p></div>
        <div class="dashboard-card"><h3>🏷️ Tags frequentes</h3>${topTags.map(([t,c])=>`<span class="badge">${escapeHtml(t)} (${c})</span>`).join('')}</div>
        <div class="dashboard-card"><h3>🧠 Zettels</h3>${zettels.length} notas atômicas</div>
      </div>
      <canvas id="monthlyChart" height="200"></canvas>
    `;
    const monthlyData = {};
    studyLog.forEach(l=>{let m=l.date.slice(0,7);monthlyData[m]=(monthlyData[m]||0)+1;});
    const months = Object.keys(monthlyData).sort(), counts = months.map(m=>monthlyData[m]);
    if (window.dashChart) window.dashChart.destroy();
    const ctx = document.getElementById('monthlyChart')?.getContext('2d');
    if (ctx) window.dashChart = new Chart(ctx, { type: 'line', data: { labels: months, datasets: [{ label: 'Leituras', data: counts, borderColor: '#00d4ff' }] } });
  }

  async function renderRadarProfessional() {
    const container = document.getElementById('radarPanel');
    if (!container) return;
    const radarHtml = `<div class="search-area"><input id="newRadarTopic" class="search-input"><button id="addRadarTopicBtn" class="search-btn">➕ Adicionar tema</button></div><div id="radarTopicsList"></div><div id="radarNews"></div>`;
    container.innerHTML = radarHtml;
    const listDiv = document.getElementById('radarTopicsList');
    listDiv.innerHTML = radarTopics.map((t,i)=>`<span class="badge">${escapeHtml(t)} <button class="remove-topic" data-idx="${i}" style="background:none;border:none;color:white;">❌</button></span>`).join('');
    document.getElementById('addRadarTopicBtn').onclick = () => {
      const topic = document.getElementById('newRadarTopic').value.trim();
      if (topic && !radarTopics.includes(topic)) { radarTopics.push(topic); saveToDB('radar', { topic }); renderRadarProfessional(); }
    };
    document.querySelectorAll('.remove-topic').forEach(btn => btn.onclick = () => { radarTopics.splice(btn.dataset.idx,1); saveToDB('radar', radarTopics); renderRadarProfessional(); });
    if (radarTopics.length) {
      const newsDiv = document.getElementById('radarNews');
      newsDiv.innerHTML = '<div class="loader"><div class="spinner"></div><div>Coletando novidades...</div></div>';
      let newsHtml = '';
      for (let topic of radarTopics) {
        const articles = await searchOpenAlex(topic, 'article');
        newsHtml += `<div class="dashboard-card"><h3>🔍 ${escapeHtml(topic)}</h3><ul>${articles.slice(0,3).map(a=>`<li><a href="${sanitizeUrl(a.url)}" target="_blank">${escapeHtml(a.title)}</a> (${a.publication_date?.slice(0,4)||'s.d.'})</li>`).join('')}</ul></div>`;
      }
      newsDiv.innerHTML = newsHtml;
    }
  }

  async function renderComparePanel() {
    if (!articlesData.length) { document.getElementById('comparePanel').innerHTML = '<div class="no-results">Realize uma busca em Artigos primeiro.</div>'; return; }
    const html = `<div id="compareSelect" class="results-grid">${articlesData.slice(0,10).map(a=>`<div class="result-card"><label><input type="checkbox" class="compare-chk" data-title="${escapeHtml(a.title)}" data-authors="${escapeHtml(a.authors.join(', '))}" data-citations="${a.citations}" data-year="${a.publication_date?.slice(0,4)}"> ${escapeHtml(a.title)}</label></div>`).join('')}</div><button id="doCompare" class="search-btn">Comparar</button><div id="compareResult"></div>`;
    document.getElementById('comparePanel').innerHTML = html;
    document.getElementById('doCompare').onclick = () => {
      const selected = Array.from(document.querySelectorAll('.compare-chk:checked')).map(cb => ({
        title: cb.dataset.title, authors: cb.dataset.authors, citations: cb.dataset.citations, year: cb.dataset.year
      }));
      if (selected.length < 2) { alert('Selecione pelo menos 2'); return; }
      let table = '<table class="comparison-table"><tr><th>Atributo</th>'+selected.map(s=>`<th>${escapeHtml(s.title.substring(0,30))}</th>`).join('')+'</tr>';
      table += '<tr><td>Autores</td>'+selected.map(s=>`<td>${escapeHtml(s.authors)}</td>`).join('')+'</tr>';
      table += '<tr><td>Ano</td>'+selected.map(s=>`<td>${escapeHtml(s.year)}</td>`).join('')+'</tr>';
      table += '<tr><td>Citações</td>'+selected.map(s=>`<td>${escapeHtml(s.citations)}</td>`).join('')+'</tr></table>';
      document.getElementById('compareResult').innerHTML = table;
    };
  }

  async function renderExportPanel() {
    const exportData = { articlesData, booksData, researchData, readArticles: [...readArticles], favorites, notes, collections, tags, zettels, backlinks: [...backlinksMap.entries()], repetitionData: [...repetitionData.entries()], userProfile, goals, studyLog, radarTopics };
    const obsidianMd = zettels.map(z => `---\ntitle: ${z.title}\ntags: ${(z.tags||[]).join(',')}\n---\n\n${z.content}\n\n${(z.links||[]).map(l=>`[[${l}]]`).join('\n')}`).join('\n\n');
    const panel = document.getElementById('exportPanel');
    panel.innerHTML = `
      <div class="dashboard-grid">
        <button id="exportJSON" class="search-btn">📄 Exportar JSON</button>
        <button id="exportCSV" class="search-btn">📊 Exportar CSV</button>
        <button id="exportObsidian" class="search-btn">📘 Exportar Obsidian</button>
        <button id="backupAll" class="search-btn">💾 Backup completo</button>
      </div>
    `;
    document.getElementById('exportJSON').onclick = () => { const blob = new Blob([JSON.stringify(exportData)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'readplus_backup.json'; a.click(); };
    document.getElementById('exportCSV').onclick = () => { let csv = "type,id,title\n"; articlesData.forEach(a=>csv+=`article,${a.id},"${a.title}"\n`); const blob = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'readplus_articles.csv'; a.click(); };
    document.getElementById('exportObsidian').onclick = () => { const blob = new Blob([obsidianMd], {type:'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'readplus_obsidian.md'; a.click(); };
    document.getElementById('backupAll').onclick = () => { const blob = new Blob([JSON.stringify(exportData)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `readplus_backup_${new Date().toISOString().slice(0,19)}.json`; a.click(); };
  }

  // ========== 6. ROTEAMENTO PRINCIPAL E INICIALIZAÇÃO ==========
  async function switchMainTab(tab) {
    currentMainTab = tab;
    if (tab === 'articles') await renderArticlesTab();
    else if (tab === 'books') await renderBooksTab();
    else if (tab === 'research') await renderResearchTab();
    else if (tab === 'brain') await renderBrainTab();
  }

  async function init() {
    await initDB();
    await loadAllData();
    document.querySelectorAll('.main-tab').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchMainTab(btn.dataset.main);
    }));
    await switchMainTab('articles');
  }
  init();
</script>
