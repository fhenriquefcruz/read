name: Nosso Guia de Sabores — Validação Isolada

on:
  push:
    paths:
      - "public/nosso-guia-de-sabores/**"
      - ".github/workflows/sabores-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Validação do código e das regras de avaliação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Conferir sintaxe JavaScript
        run: |
          node --check public/nosso-guia-de-sabores/core.js
          node --check public/nosso-guia-de-sabores/app.js
          node --check public/nosso-guia-de-sabores/smoke.mjs
      - name: Rodar testes unitários
        run: node --test public/nosso-guia-de-sabores/core.test.mjs

  browser:
    name: Teste real no Chromium — desktop e mobile
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Iniciar servidor estático local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sabores-http.log 2>&1 &
          sleep 2
      - name: Rodar teste E2E
        run: node public/nosso-guia-de-sabores/smoke.mjs
