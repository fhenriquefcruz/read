name: Format Once

on:
  push:
    branches:
      - rebuild/readplus-platform-v3

permissions:
  contents: write

concurrency:
  group: format-readplus-v3
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/readplus-platform-v3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- src tests e2e; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests e2e
          git commit -m "style: apply Biome formatting"
          git push origin HEAD:rebuild/readplus-platform-v3
